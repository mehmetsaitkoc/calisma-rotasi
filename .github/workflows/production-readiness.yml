name: Production Readiness

on:
  push:
    branches: [codex/production-student-recovery]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Contracts, route engine and question bank
        run: npm test
      - name: Account, security, recovery and native contracts
        run: |
          npm run accounts:test
          npm run student-recovery:test
          npm run native:test
          node scripts/personal-source-compat.test.mjs
      - run: npx playwright install --with-deps chromium
      - name: Sequential isolated browser scenarios
        run: |
          node scripts/web-beta-browser.test.mjs
          node scripts/recovery-browser.test.mjs
          node scripts/web-beta-share-readiness.mjs
          npm run accounts:browser
          node scripts/onboarding-resume-browser.test.mjs
          node scripts/personal-source-browser.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-browser-evidence
          path: work/production-evidence/
          if-no-files-found: ignore
          retention-days: 14

  android-technical-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ROTA_ANDROID_API_BASE: https://calisma-rotasi-1.onrender.com
      GRADLE_USER_HOME: ${{ github.workspace }}/work/gradle-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: '15859902'
          # The operator explicitly accepted the Android SDK license for this build.
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'true'
          packages: 'platform-tools'
      - name: Install approved SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Verified official bundletool
        run: |
          mkdir -p work/android-build
          curl --fail --location --silent --show-error https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar --output work/android-build/bundletool.jar
          echo 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  work/android-build/bundletool.jar' | sha256sum --check
          echo "BUNDLETOOL_JAR=$GITHUB_WORKSPACE/work/android-build/bundletool.jar" >> "$GITHUB_ENV"
      - name: Debug and unsigned release builds
        run: |
          npm run native:test
          npm run android:debug
          node scripts/android-verify.mjs debug
          npm run android:release
          node scripts/android-verify.mjs release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-provisional-technical-build
          path: |
            work/android-build/*-build.json
            work/android-build/*-verification.json
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/reports/lint-results-*.html
          if-no-files-found: warn
          retention-days: 14
