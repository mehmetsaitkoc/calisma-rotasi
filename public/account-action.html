<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex"><title>Hesap işlemleri · Çalışma Rotası</title>
<style>body{margin:0;background:#f4f6fd;color:#152241;font:17px/1.65 system-ui,sans-serif}main{box-sizing:border-box;max-width:620px;margin:32px auto;padding:24px}section{background:#fff;border:1px solid #dce3f3;border-radius:20px;padding:28px;margin:24px 0;box-shadow:0 12px 45px #17295908}h1{line-height:1.2;font-size:30px}a{color:#344ed8}label{display:block;margin:16px 0}input{box-sizing:border-box;display:block;width:100%;font:inherit;border:1px solid #a8b6d0;border-radius:9px;padding:12px;margin-top:7px}button{font:inherit;border:0;background:#344ee5;color:white;border-radius:10px;padding:12px 18px;min-height:48px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.notice{padding:14px;background:#eef2ff;border-radius:10px}#status{white-space:pre-line}#status[data-error=true]{color:#a12439}[hidden]{display:none!important}@media(max-width:480px){main{margin:0;padding:18px}section{padding:20px}}</style>
<script defer src="/account-action.js"></script></head><body><main><nav><a href="/">Çalışma Rotası</a> · <a href="/privacy.html">Gizlilik</a></nav><section><h1 id="title">Hesap işlemleri</h1><p id="description"></p>
<form id="recovery-form" hidden><label>Hesabındaki e-posta adresi<input name="email" type="email" maxlength="254" autocomplete="email" required></label><button type="submit">Parola yenileme bağlantısı iste</button></form>
<form id="reset-form" hidden><label>Yeni parolan<input name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label><label>Yeni parolanı tekrar yaz<input name="confirmation" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label><button type="submit">Parolamı yenile</button></form>
<form id="verify-form" hidden><button type="submit">E-posta adresimi doğrula</button></form>
<p id="status" role="status" aria-live="polite"></p><p><a href="/">Uygulamaya dön</a></p></section></main></body></html>
