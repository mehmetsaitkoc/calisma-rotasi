.analysis-panel{padding:0;overflow:hidden;margin-bottom:24px;border-color:#cdd9c2}
.analysis-top{padding:25px 25px 21px;background:#edf2e7;border-bottom:1px solid #dce4d4}
.analysis-top h2{font-size:27px;margin:9px 0 10px;letter-spacing:-.04em}
.analysis-top p{font-size:12px;color:#6c7962;max-width:670px;line-height:1.8}
.analysis-top .analysis-select{max-width:270px;min-width:210px;background:#fffefa;font-size:12px}
.analysis-flow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:20px;font-size:10px;color:#627457}
.analysis-flow span{border:1px solid #d3dfc9;border-radius:7px;padding:5px 9px;background:#f8faf5}
.analysis-flow .active{background:#244c38;color:#fafbef;border-color:#244c38}

.analysis-test .test-score{font-size:28px;letter-spacing:-1px;line-height:1.2;font-variant-numeric:tabular-nums}
.analysis-test .test-score small{font-size:11px;letter-spacing:0;color:var(--muted)}
.test-numbers{display:flex;gap:14px;font-size:10px;color:var(--muted);margin:13px 0 14px;flex-wrap:wrap}
.test-numbers strong{color:#52684a;font-weight:650}
.test-delta{font-size:11px;font-weight:600;color:#536c40;background:#edf3e5;padding:4px 7px;border-radius:6px;display:inline-block}
.test-delta.down{color:#975d38;background:#fbede0}.test-delta.neutral{color:#747d6d;background:#f0f1ec}

.test-action{margin-top:14px;width:100%;font-size:11px}

.analysis-guidance .icon{margin-top:2px;color:#7b8e68;flex-shrink:0}
.analysis-notes{border-top:1px solid var(--line);padding-top:21px;margin-top:23px}

.analysis-empty{padding:21px;border:1px dashed #d5ddca;border-radius:10px;background:#f9faf5;margin-top:15px;color:var(--muted);font-size:12px;line-height:1.8}
.note-source{font-size:10px;color:#718365;line-height:1.8;background:#f0f4ea;padding:8px 11px;border-radius:7px}
.review-summary{padding:15px;background:#eff3e7;border-radius:10px;margin-bottom:20px}.review-summary h3{font-size:18px;line-height:1.5;overflow-wrap:anywhere}.review-summary p{font-size:11px;color:#748567;margin-top:5px;line-height:1.8}
.review-capacity{font-size:11px;line-height:1.8;margin-top:16px;padding:13px;border:1px solid #dce5d1;background:#f5f8ef;border-radius:9px}.review-capacity.warn{background:#fff3e4;border-color:#efddc7;color:#94663a}
.review-capacity .check-chip{margin-top:11px;background:#fffaf2;align-items:flex-start;white-space:normal}
.review-mark{font-size:8px;background:#edf3e3;color:#617e49;border-radius:4px;padding:2px 5px;margin-left:5px;letter-spacing:0}

<script>
(function(root){
'use strict';
const C=root.RotaCatalog||(typeof require==='function'?require('./catalog.js'):null);
const uid=()=> (root.crypto&&root.crypto.randomUUID?root.crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2));
const iso=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function dayAdd(date,days){const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+days);return iso(d);}
function validDate(v){return typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v)&&!isNaN(new Date(v+'T12:00:00'))&&iso(new Date(v+'T12:00:00'))===v;}
function workspace(exam){return {configured:false,settings:{name:'',track:exam==='yks'?'say':'lisans',dailyMinutes:90,days:[1,2,3,4,5,6],priorities:[],target:'',targetDate:''},profile:{version:1,completed:false,targetScore:0,targetRank:0,subjectLevels:{},updated:0},topicState:{},customTopics:[],plan:[],logs:[],exams:[],mistakes:[],route:{version:1,lastRun:'',lastAutoDate:'',lastReason:'',lastChanged:0,decisions:[]},taskEvents:[]};}
const fresh=()=>({version:1,activeExam:null,workspaces:{kpss:workspace('kpss'),yks:workspace('yks')}});
function courses(exam,track){return C.subjects.filter(s=>s.exam===exam&&(!s.tracks.length||s.tracks.includes(track)));}
function allTopics(w,exam){return courses(exam,w.settings.track).flatMap(s=>s.topics).concat(w.customTopics.filter(t=>courses(exam,w.settings.track).some(s=>s.id===t.subjectId)));}
function topic(w,id){return C.subjects.flatMap(s=>s.topics).find(t=>t.id===id)||w.customTopics.find(t=>t.id===id);}
function generatePlan(w,exam,start){
 if(!validDate(start))throw Error('Geçerli bir başlangıç tarihi seç.');
 const end=dayAdd(start,6),kept=w.plan.filter(p=>p.done||p.kind==='review'||p.date<start||p.date>end);
 const already=new Set(kept.filter(p=>!p.done).map(p=>p.topicId));
 const subs=courses(exam,w.settings.track), available=allTopics(w,exam).filter(t=>(w.topicState[t.id]?.status||0)!==2&&!already.has(t.id));
 const ring=subs.flatMap(s=>w.settings.priorities.includes(s.id)?[s.id,s.id]:[s.id]);
 const added=[];let cursor=0;
 for(let day=0;day<7;day++){
  const date=dayAdd(start,day);if(!w.settings.days.includes(new Date(date+'T12:00:00').getDay()))continue;
  const used=kept.filter(p=>p.date===date).reduce((n,p)=>n+p.minutes+5,0);
  const slots=Math.max(0,Math.floor((w.settings.dailyMinutes-used)/30));
  for(let slot=0;slot<slots;slot++){
   let t;
   for(let tries=0;tries<ring.length;tries++){const sub=ring[cursor++%ring.length];const idx=available.findIndex(a=>a.subjectId===sub);if(idx>=0){t=available.splice(idx,1)[0];break;}}
   if(!t)break;
   added.push({id:uid(),date,subjectId:t.subjectId,topicId:t.id,title:t.title,minutes:25,done:false});
  }
 }
 return {plan:kept.concat(added).sort((a,b)=>a.date.localeCompare(b.date)),added:added.length};
}
function calcNet(parts,penalty=4){
 if(![0,3,4].includes(penalty))throw Error('Geçersiz net hesaplama kuralı.');
 let correct=0,wrong=0,total=0;
 for(const p of parts){if(![p.total,p.correct,p.wrong].every(Number.isInteger)||p.total<1||p.total>1000||p.correct<0||p.wrong<0||p.correct+p.wrong>p.total)throw Error(`${p.label||'Test'}: Doğru + yanlış, soru sayısını aşamaz.`);correct+=p.correct;wrong+=p.wrong;total+=p.total;}
 return {net:correct-(penalty?wrong/penalty:0),correct,wrong,blank:total-correct-wrong,total};
}
function safeUrl(text){if(!text)return '';try{const u=new URL(text);return ['https:','http:'].includes(u.protocol)?u.href:'';}catch{return '';}}
function resourceUrl(text,position){const raw=safeUrl(text);if(!raw)return '';const u=new URL(raw);if(/(^|\.)(youtube\.com|youtu\.be)$/.test(u.hostname)&&position>0)u.searchParams.set('t',Math.round(position*60)+'s');return u.href;}
function int(v,min,max,label){if(!Number.isInteger(v)||v<min||v>max)throw Error('Yedekte geçersiz sayı: '+label);return v;}
function text(v,max=2000){if(typeof v!=='string'||v.length>max)throw Error('Yedekte geçersiz metin.');return v;}
function checkedDate(v){if(!validDate(v))throw Error('Yedekte geçersiz tarih.');return v;}
function array(v){if(!Array.isArray(v)||v.length>10000)throw Error('Yedekte geçersiz liste.');return v;}
function ident(v){const s=text(v,120);if(!/^[a-zA-Z0-9_-]+$/.test(s)||['__proto__','prototype','constructor'].includes(s))throw Error('Yedekte geçersiz kayıt kimliği.');return s;}
function validateBackup(data){
 if(!data||data.version!==1||!data.workspaces)throw Error('Bu dosya Çalışma Rotası birleşik sürüm yedeği değil.');
 const out=fresh();out.activeExam=['kpss','yks'].includes(data.activeExam)?data.activeExam:null;
 for(const e of ['kpss','yks']){
  const old=data.workspaces[e];if(!old||!old.settings)throw Error('Yedekte sınav alanı eksik.');
  const w=out.workspaces[e],s=old.settings;w.configured=!!old.configured;
  if(e==='yks'&&!C.TRACKS[s.track])throw Error('Yedekte geçersiz YKS alanı.');
  w.settings={name:text(s.name,60),track:e==='yks'?s.track:'lisans',dailyMinutes:int(s.dailyMinutes,30,720,'günlük süre'),days:[...new Set(array(s.days).map(n=>int(n,0,6,'gün')))],priorities:array(s.priorities).map(ident),target:text(s.target,160),targetDate:s.targetDate?checkedDate(s.targetDate):''};
  const op=old.profile&&typeof old.profile==='object'&&!Array.isArray(old.profile)?old.profile:{};
  const levelSource=op.subjectLevels&&typeof op.subjectLevels==='object'&&!Array.isArray(op.subjectLevels)?op.subjectLevels:{};
  const subjectLevels={};
  for(const [sid,lv] of Object.entries(levelSource)){if(C.subjects.some(x=>x.id===sid&&x.exam===e)&&Number.isInteger(lv)&&lv>=0&&lv<=3)subjectLevels[sid]=lv;}
  w.profile={version:1,completed:!!op.completed,targetScore:Number.isFinite(op.targetScore)?Math.max(0,Math.min(1000,Number(op.targetScore))):0,targetRank:Number.isFinite(op.targetRank)?Math.max(0,Math.min(100000000,Math.round(Number(op.targetRank)))):0,subjectLevels,updated:Number.isFinite(op.updated)?Math.max(0,op.updated):0};
  if(!w.settings.days.length)throw Error('En az bir çalışma günü olmalı.');
  const subjectIds=new Set(C.subjects.filter(s=>s.exam===e).map(s=>s.id));
  const sub=v=>{if(!subjectIds.has(v))throw Error('Yedekte diğer sınava ait ders var.');return v;};
  w.settings.priorities=w.settings.priorities.filter(v=>subjectIds.has(v));
  w.customTopics=array(old.customTopics).map(t=>({id:ident(t.id),subjectId:sub(t.subjectId),title:text(t.title,180)}));
  const topicIds=new Set(C.subjects.filter(s=>s.exam===e).flatMap(s=>s.topics.map(t=>t.id)).concat(w.customTopics.map(t=>t.id)));
  if(!old.topicState||typeof old.topicState!=='object'||Array.isArray(old.topicState))throw Error('Geçersiz konu kayıtları.');
  for(const [id,t] of Object.entries(old.topicState)){
   if(!topicIds.has(id))continue;
   w.topicState[id]={status:int(t.status??0,0,2,'konu durumu'),url:safeUrl(text(t.url||'',2000)),position:int(t.position||0,0,100000,'kaynak dakikası'),note:text(t.note||'',4000),updated:typeof t.updated==='number'?t.updated:0};
  }
  w.plan=array(old.plan).map(p=>({id:ident(p.id),date:checkedDate(p.date),subjectId:sub(p.subjectId),topicId:ident(p.topicId),title:text(p.title,180),minutes:int(p.minutes,1,1440,'oturum süresi'),done:!!p.done,...(['review','route'].includes(p.kind)?{kind:p.kind}:{}),...(p.sourceMistakeId?{sourceMistakeId:ident(p.sourceMistakeId)}:{}),...(p.sourceTeacherQuestionId?{sourceTeacherQuestionId:ident(p.sourceTeacherQuestionId)}:{}),...(p.source?{source:text(p.source,40)}:{}),...(Number.isFinite(p.priority)?{priority:Math.max(0,Math.min(100,Math.round(p.priority)))}:{}),...(p.reason?{reason:text(p.reason,500)}:{}),...(p.taskState&&['open','later'].includes(p.taskState)?{taskState:p.taskState}:{}),...(p.deferUntil?{deferUntil:checkedDate(p.deferUntil)}:{}),...(p.routeKey?{routeKey:text(p.routeKey,180)}:{})}));
  w.logs=array(old.logs).map(l=>({id:ident(l.id),date:checkedDate(l.date),subjectId:sub(l.subjectId),title:text(l.title,180),minutes:int(l.minutes,0,1440,'çalışma süresi'),questions:int(l.questions,0,5000,'soru sayısı'),note:text(l.note||'',2000),sessionId:l.sessionId?ident(l.sessionId):''}));
  w.exams=array(old.exams).map(x=>{if(!C.TYPES[x.type]||C.TYPES[x.type].exam!==e)throw Error('Yedekte diğer sınava ait deneme var.');const parts=array(x.parts).map(p=>({label:text(p.label,100),total:p.total,correct:p.correct,wrong:p.wrong}));if(!parts.length||parts.length>20)throw Error('Geçersiz deneme testleri.');calcNet(parts,x.penalty);return {id:ident(x.id),type:x.type,name:text(x.name,120),date:checkedDate(x.date),parts,penalty:x.penalty,note:text(x.note||'',2000)};});

function openOffer(id){if(!Object.hasOwn(OFFERS,id))return;const o=OFFERS[id];openModal('Paketini gözden geçir',`<div class="checkout-demo-tag">${icon('shield')} TASARIM ÖNİZLEMESİ · ÖDEME ALINMAZ</div><div class="checkout-layout"><section class="checkout-package">${plusBadge('ROTA PLUS')}<h3>${o.name}</h3><p>${o.duration}</p>${featureList(['Deneme karşılaştırması','Yanlıştan tekrar planı','Ders bazlı aylık rapor','KPSS + YKS birlikte'])}</section><section class="checkout-summary"><span class="eyebrow">PAKET ÖZETİ</span><div class="checkout-line"><span>${o.duration}</span><strong>${o.amount} ₺</strong></div><div class="checkout-total"><span>Örnek paket bedeli</span><strong>${o.amount} ₺</strong></div><p class="checkout-renewal">${o.renewal}</p><div class="payment-placeholder">${icon('credit')}<div><strong>Ödeme bağlantısı kapalı</strong><span>Kart bilgisi alınmaz.</span></div>${icon('lock')}</div>${btn('Plus görünümünü dene '+icon('arrow'),'paid-activate','primary checkout-button',`data-offer="${id}"`)}<p class="checkout-safe">Bu düğme sadece arayüzü Plus görünümüne geçirir. Tahsilat yapmaz, üyelik başlatmaz.</p></section></div>`);$('#modal').classList.add('checkout-dialog');}

function exampleData(){const data=R.fresh();data.activeExam='yks';for(const e of ['kpss','yks']){const ws=data.workspaces[e];ws.configured=true;ws.settings={...ws.settings,name:'Örnek öğrenci',track:e==='yks'?'say':'lisans',days:[0,1,2,3,4,5,6],dailyMinutes:120,target:'Her hafta daha bilinçli bir çalışma düzeni.'};const subs=R.courses(e,ws.settings.track);const topics=subs.flatMap(s=>s.topics);topics.slice(0,e==='yks'?27:14).forEach((t,i)=>{ws.topicState[t.id]={status:i%4===0?1:2,url:'',position:0,note:'',updated:Date.now()};});ws.plan=R.generatePlan(ws,e,today()).plan;
 for(let d=6;d>=0;d--){[0,1].forEach((n)=>{const s=subs[(d+n)%subs.length];ws.logs.push({id:R.uid(),date:R.dayAdd(today(),-d),subjectId:s.id,title:s.topics[n].title,minutes:[25,50,45][(d+n)%3],questions:[20,30,40][(d+n)%3],note:'Örnek panel için oluşturulmuş kayıt.',sessionId:''});});}
 const type=e==='yks'?'TYT':'KPSS';const q=C.TYPES[type].parts;
 [[-14,0.58],[-7,0.65],[-1,0.7]].forEach(([d,ratio],i)=>ws.exams.push({id:'sample-'+e+'-'+i,type,name:'Örnek '+type+' · '+(i+1),date:R.dayAdd(today(),d),parts:q.map(([label,total],j)=>({label,total,correct:Math.floor(total*(ratio-(i===2&&j===2?.13:0))),wrong:Math.min(total-Math.floor(total*ratio),Math.floor(total*(.2-i*.03)))})),penalty:4,note:'Bu değerler gerçek bir öğrencinin sonucu değildir.'}));
 const sub=subs.find(s=>s.id===(e==='yks'?'t-ma':'k-ma')),topic=sub.topics.find(t=>t.title==='Problemler')||sub.topics[0];ws.mistakes.push({id:'sample-note-'+e,subjectId:sub.id,topicId:topic.id,title:'Problemler · denklem kurma',cause:'Yöntem / işlem hatası',note:'Örnek not: Sorudaki iki miktarın ilişkisini yanlış kurdum. Çözümü yeniden yazıp benzer sorularla tekrar edeceğim.',reviewDate:today(),resolved:false,examId:ws.exams.at(-1).id,partLabel:e==='yks'?'Temel matematik':'Matematik'});
 }
 return R.validateBackup(data);
}
function startSample(){leaveVideo();closeModal();if(!sampleSaved){sampleSaved={state,timers,studyClocks,view:ui.view,storageBlocked,storageProblem};state=exampleData();timers={};studyClocks={kpss:{},yks:{}};storageBlocked=false;storageProblem='';$('#storage-warning').hidden=true;}ui.analysisId='';ui.mockFilter='';ui.view='today';render();window.scrollTo({top:0,behavior:'instant'});toast('Örnek verilerle gösterim. Kendi kayıtların değişmedi.');}

function handlePaidAction(b){const a=b.dataset.action;switch(a){
 case 'paid-pricing':closeModal();navigate('pricing');break;
 case 'paid-membership':closeModal();navigate(state.activeExam&&w().configured?'membership':'pricing');break;
 case 'paid-start':closeModal();navigate(state.activeExam&&w().configured?'today':state.activeExam?'setup':'select');break;

 case 'paid-tier':changePreviewTier(b.dataset.tier);break;
 case 'paid-period':if(['monthly','quarterly'].includes(b.dataset.period)){billingPeriod=b.dataset.period;render();}break;

 case 'paid-activate':showActivated(b.dataset.offer);break;

 case 'paid-end-sample':endSample();break;
 }}

function profileSubjects(track=w().settings.track){return R.courses(state.activeExam,state.activeExam==='yks'?track:'lisans');}
function profileDefaultLevel(id){const v=w().profile&&w().profile.subjectLevels?w().profile.subjectLevels[id]:undefined;return Number.isInteger(v)&&v>=0&&v<=3?v:2;}
function profileLevelLabel(v){return ['Çok zayıf','Zayıf','Orta','İyi'][Number(v)]||'Orta';}
function profileLevelOptions(selected){
 return [[0,'Çok zayıf · Baştan başlamalıyım'],[1,'Zayıf · Temelim var ama eksik'],[2,'Orta · Çalışınca yapabiliyorum'],[3,'İyi · Daha çok soru/tekrar lazım']].map(function(x){return '<option value="'+x[0]+'" '+(Number(selected)===x[0]?'selected':'')+'>'+x[1]+'</option>';}).join('');
}
function profileLevelsHtml(track=w().settings.track){
 return profileSubjects(track).map(function(sub){
  const label=(state.activeExam==='yks'?sub.stage+' · ':'')+sub.name;
  return '<label class="profile-level-card"><span><strong>'+esc(label)+'</strong><small>Rota motoru bu seviyeyi görev önceliğinde kullanır.</small></span><select name="level:'+sub.id+'" aria-label="'+esc(sub.name)+' seviyen">'+profileLevelOptions(profileDefaultLevel(sub.id))+'</select></label>';
 }).join('');
}
function profileFields(profile=w().profile||{},setupMode=false,track=w().settings.track){
 const targetScore=Number(profile.targetScore)||0,targetRank=Number(profile.targetRank)||0;
 const goalField=state.activeExam==='kpss'
  ? '<label class="field">Hedef KPSS puanın<input name="targetScore" type="number" min="0" max="100" step="0.1" value="'+(targetScore||'')+'" placeholder="Örn. 88"><span class="field-help">Boş bırakabilirsin. Yüksek hedef, zayıf derslerde önceliği biraz artırır.</span></label>'
  : '<label class="field">Hedef sıralaman<input name="targetRank" type="number" min="1" max="100000000" step="1" value="'+(targetRank||'')+'" placeholder="Örn. 30000"><span class="field-help">Boş bırakabilirsin. Daha iddialı hedef, zayıf derslerin ağırlığını artırır.</span></label>';
 return '<div class="profile-section"><div class="profile-section-head"><div><div class="eyebrow">KİŞİSEL ROTA PROFİLİ</div><h3>Ders seviyeni söyle, rota ağırlığı kendi ayarlasın.</h3></div><span class="pill plain">Sonradan değiştirilebilir</span></div><div class="profile-goal-grid">'+goalField+'<label class="field">Profil mantığı<input value="Seviye + hedef + süre + çalışma günleri" readonly><span class="field-help">Denemeler ve çalışma geçmişin geldikçe rota bu ilk beyanın üzerine gerçek veriyi ekler.</span></label></div><div class="small mb" style="margin-bottom:8px;font-weight:650">Derslerde kendini nerede görüyorsun?</div><div class="profile-level-grid" data-profile-levels>'+profileLevelsHtml(track)+'</div><div class="profile-tip"><strong>Nasıl kullanacağız?</strong> “Çok zayıf” ve “Zayıf” dersler daha yüksek başlangıç puanı alır. İyi olduğun dersler silinmez; yalnız daha seyrek öne çıkar. Deneme sonucu geldikçe gerçek performans sinyali bu öz değerlendirmenin önüne geçebilir.</div></div>';
}
function readProfile(form){
 const fd=new FormData(form),track=state.activeExam==='yks'?String(fd.get('track')||w().settings.track):'lisans',levels={};
 for(const sub of profileSubjects(track)){const raw=fd.get('level:'+sub.id),v=Number(raw);levels[sub.id]=Number.isInteger(v)&&v>=0&&v<=3?v:2;}
 const score=Number(fd.get('targetScore')||0),rank=Number(fd.get('targetRank')||0);
 if(state.activeExam==='kpss'&&(!Number.isFinite(score)||score<0||score>100))throw Error('Hedef KPSS puanı 0–100 arasında olmalı.');
 if(state.activeExam==='yks'&&(!Number.isFinite(rank)||rank<0||rank>100000000||!Number.isInteger(rank)))throw Error('Hedef sıralamayı tam sayı olarak gir.');
 return {version:1,completed:true,targetScore:state.activeExam==='kpss'?score:0,targetRank:state.activeExam==='yks'?rank:0,subjectLevels:levels,updated:Date.now()};
}

${sub.id}" ${s.priorities.includes(sub.id)?'checked':''}>${esc((state.activeExam==='yks'?sub.stage+' ':'')+sub.name)}</label>`).join('')}</div></div>`:''}</div>`;}

function routeEnsure(space=w()){
 space.route=space.route&&typeof space.route==='object'?space.route:{version:1,lastRun:'',lastAutoDate:'',lastReason:'',lastChanged:0,decisions:[]};
 space.profile=space.profile&&typeof space.profile==='object'?space.profile:{version:1,completed:false,targetScore:0,targetRank:0,subjectLevels:{},updated:0};
 space.profile.subjectLevels=space.profile.subjectLevels&&typeof space.profile.subjectLevels==='object'?space.profile.subjectLevels:{};
 space.taskEvents=Array.isArray(space.taskEvents)?space.taskEvents:[];
 for(const p of space.plan){if(!p.taskState)p.taskState='open';}
 return space.route;
}
function routeEvent(taskId,action){routeEnsure();w().taskEvents.push({id:R.uid(),taskId,date:today(),action,created:Date.now()});w().taskEvents=w().taskEvents.slice(-300);}
function routeSourceLabel(source){return ({backlog:'AKSAYAN',mistake:'YANLIŞ TEKRARI',ai_teacher:'ROTA HOCA',exam:'DENEME SİNYALİ',profile:'SEVİYE PROFİLİ',priority:'ÖNCELİKLİ DERS',curriculum:'KONU ROTASI',review:'TEKRAR'}[source]||'ROTA');}
function routeExamWeakness(){
 const scores={};const xs=[...w().exams].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);
 for(const x of xs){for(const p of x.parts){const n=R.calcNet([p],x.penalty),ratio=Math.max(0,Math.min(1,n.net/Math.max(1,p.total))),ids=C.PART_SUBJECTS[x.type]?.[p.label]||[];for(const id of ids){if(!subject(id)||subject(id).exam!==state.activeExam)continue;(scores[id]||(scores[id]=[])).push(ratio);}}}
 const out={};for(const [id,vals] of Object.entries(scores)){const avg=vals.reduce((a,b)=>a+b,0)/vals.length;out[id]={ratio:avg,boost:Math.round(Math.max(0,.78-avg)*55),samples:vals.length};}return out;
}

function routeGoalPressure(){
 const p=w().profile||{};let pressure=0;
 if(state.activeExam==='kpss'&&p.targetScore){pressure=p.targetScore>=90?8:p.targetScore>=85?5:p.targetScore>=80?3:1;}
 if(state.activeExam==='yks'&&p.targetRank){pressure=p.targetRank<=10000?8:p.targetRank<=50000?5:p.targetRank<=100000?3:1;}
 if(w().settings.targetDate){const days=Math.ceil((new Date(w().settings.targetDate+'T12:00:00')-new Date(today()+'T12:00:00'))/86400000);if(days>0&&days<=60)pressure+=4;else if(days>60&&days<=120)pressure+=2;}
 return Math.min(12,pressure);
}
function routeProfileSignal(subjectId){
 routeEnsure();const p=w().profile||{},level=Number.isInteger(p.subjectLevels?.[subjectId])?p.subjectLevels[subjectId]:2,base=[24,16,7,-3][level]??7,goal=routeGoalPressure(),goalBoost=level<=1?goal:level===2?Math.round(goal/2):0;
 return {level,boost:base+goalBoost,label:profileLevelLabel(level),goalBoost};
}
function routeLastLogDate(subjectId){return [...w().logs].filter(l=>l.subjectId===subjectId).sort((a,b)=>b.date.localeCompare(a.date))[0]?.date||'';}
function routeCandidateFromPlan(p){const overdue=p.date<today(),days=overdue?Math.max(1,Math.floor((new Date(today()+'T12:00:00')-new Date(p.date+'T12:00:00'))/86400000)):0;let source=p.source||'curriculum',priority=Number.isFinite(p.priority)?p.priority:35,reason=p.reason||'Haftalık çalışma rotandaki görev.';if(p.sourceMistakeId){source='mistake';priority=Math.max(priority,78);reason='Yanlış defterindeki bir tekrar görevi.';}else if(p.sourceTeacherQuestionId){source='ai_teacher';priority=Math.max(priority,72);reason='Rota Hoca’da tekrar gerektiren bir sorudan geldi.';}else if(overdue){source='backlog';priority=Math.max(priority,82+Math.min(12,days*3));reason=`${days} gün önce tamamlanmadığı için rota motoru yeniden yerleştiriyor.`;}return {...p,source,priority:Math.min(100,priority),reason,earliest:p.deferUntil&&p.deferUntil>today()?p.deferUntil:today(),routeKey:p.routeKey||('plan:'+p.id),taskState:p.taskState==='later'?'later':'open'};}
function routeBuildCandidates(){
 const space=w(),weak=routeExamWeakness(),seenTopics=new Set(),seenKeys=new Set(),out=[];
 const push=c=>{if(!c||seenKeys.has(c.routeKey))return;seenKeys.add(c.routeKey);if(c.topicId&&R.topic(space,c.topicId))seenTopics.add(c.topicId);out.push(c);};
 const horizon=R.dayAdd(today(),13);
 for(const p of space.plan.filter(p=>!p.done&&(p.date<=horizon||p.date<today())))push(routeCandidateFromPlan(p));
 for(const m of space.mistakes.filter(m=>!m.resolved)){
  const key='mistake:'+m.id;if(seenKeys.has(key)||space.plan.some(p=>!p.done&&p.sourceMistakeId===m.id))continue;const due=m.reviewDate<=today();push({id:R.uid(),date:today(),subjectId:m.subjectId,topicId:m.topicId||('review-'+m.id),title:('Tekrar · '+m.title).slice(0,180),minutes:25,done:false,kind:'review',sourceMistakeId:m.id,source:'mistake',priority:due?82:66,reason:due?'Yanlış defterindeki tekrar tarihi geldi.':'Yanlış defterindeki konu yeniden çalışılmalı.',earliest:due?today():m.reviewDate,routeKey:key,taskState:'open'});
 }
 try{for(const q of teacherQuestions().filter(q=>['stuck','review'].includes(q.status))){const key='teacher:'+q.id;if(seenKeys.has(key)||space.plan.some(p=>!p.done&&p.sourceTeacherQuestionId===q.id))continue;push({id:R.uid(),date:today(),subjectId:q.subjectId,topicId:q.topicId||('teacher-'+q.id),title:('Rota Hoca tekrar · '+(R.topic(space,q.topicId)?.title||q.question||subName(q.subjectId))).slice(0,180),minutes:25,done:false,kind:'review',sourceTeacherQuestionId:q.id,source:'ai_teacher',priority:q.status==='stuck'?78:68,reason:q.status==='stuck'?'Rota Hoca’da “Anlamadım” olarak işaretlendi.':'Rota Hoca’da tekrar bakılacak olarak işaretlendi.',earliest:today(),routeKey:key,taskState:'open'});}}catch{}
 const topics=R.allTopics(space,state.activeExam).filter(t=>(space.topicState[t.id]?.status||0)!==2&&!seenTopics.has(t.id));
 for(const t of topics){
  const isPriority=space.settings.priorities.includes(t.subjectId),wk=weak[t.subjectId],ps=routeProfileSignal(t.subjectId),last=routeLastLogDate(t.subjectId);
  let priority=28+(isPriority?18:0)+(wk?.boost||0)+ps.boost;
  let reason=isPriority?'Bu dersi öncelikli olarak seçtin.':'Tamamlanmamış konu rotandan geliyor.';
  let source=wk?.boost?'exam':isPriority?'priority':ps.level<=1?'profile':'curriculum';
  if(wk?.boost){reason='Son deneme verilerinde '+subName(t.subjectId)+' tarafı daha fazla çalışma sinyali veriyor.';}
  else if(ps.level<=1){reason='Seviye profilinde '+subName(t.subjectId)+' dersini “'+ps.label+'” olarak işaretledin; başlangıç rotasında bu yüzden daha sık öne çıkıyor.';if(ps.goalBoost)reason+=' Hedefin bu ağırlığı biraz daha artırıyor.';}
  else if(ps.level===3){reason='Seviye profilinde '+subName(t.subjectId)+' dersin iyi; rota bu dersi koruyor ancak zayıf derslerin önüne gereksiz yere geçirmiyor.';}
  if(!last||last<R.dayAdd(today(),-7)){priority+=7;reason+=' Bu derste son 7 günde kayıtlı çalışma az.';}
  push({id:R.uid(),date:today(),subjectId:t.subjectId,topicId:t.id,title:t.title,minutes:25,done:false,kind:'route',source,priority:Math.max(12,Math.min(92,priority)),reason,earliest:today(),routeKey:'topic:'+t.id,taskState:'open'});
 }
 return out.sort((a,b)=>b.priority-a.priority||String(a.routeKey).localeCompare(String(b.routeKey)));
}
function routeRebalance(reason='Rota güncellendi',silent=false){
 if(!state.activeExam||!w().configured)return {changed:0,scheduled:0};routeEnsure();const space=w(),start=today(),end=R.dayAdd(start,20),candidates=routeBuildCandidates();const managedIds=new Set(candidates.filter(c=>space.plan.some(p=>p.id===c.id)).map(c=>c.id));
 const kept=space.plan.filter(p=>p.done||p.date>end||(!managedIds.has(p.id)&&p.date>R.dayAdd(start,13)));
 const days=[];for(let i=0;i<21;i++){const date=R.dayAdd(start,i),dow=new Date(date+'T12:00:00').getDay();if(space.settings.days.includes(dow)){const dayKept=kept.filter(p=>p.date===date);days.push({date,used:dayKept.reduce((n,p)=>n+(p.minutes||25)+5,0),limit:space.settings.dailyMinutes,subjects:new Set(dayKept.map(p=>p.subjectId))});}}
 const scheduled=[];for(const c of candidates){let slot=days.find(d=>d.date>=c.earliest&&d.used+(c.minutes||25)+5<=d.limit&&!d.subjects.has(c.subjectId));if(!slot)slot=days.find(d=>d.date>=c.earliest&&d.used+(c.minutes||25)+5<=d.limit);if(!slot)continue;const task={...c,date:slot.date,done:false,taskState:c.taskState==='later'&&slot.date===today()?'later':'open'};delete task.earliest;slot.used+=task.minutes+5;slot.subjects.add(task.subjectId);scheduled.push(task);}
 const oldMap=new Map(space.plan.filter(p=>!p.done).map(p=>[p.id,p.date]));let changed=0;for(const p of scheduled)if(oldMap.get(p.id)!==p.date)changed++;space.plan=kept.concat(scheduled).sort((a,b)=>a.date.localeCompare(b.date)||((b.priority||0)-(a.priority||0)));space.route.lastRun=today();space.route.lastReason=reason+(candidates.length>scheduled.length?` ${candidates.length-scheduled.length} düşük öncelikli konu aktif rota penceresi dışında bırakıldı.`:'');space.route.lastChanged=changed;space.route.decisions=scheduled.slice(0,80).map(p=>({taskId:p.id,date:p.date,source:p.source||'curriculum',priority:p.priority||0,reason:p.reason||''}));if(!silent)toast(changed?`${changed} görev kapasiteni aşmadan yeniden yerleştirildi.`:'Rotan kontrol edildi; yerleşim değişmedi.');return {changed,scheduled:scheduled.length};
}
function routeAutoSync(){if(!state.activeExam||!w().configured||sampleSaved)return;routeEnsure();const overdue=w().plan.some(p=>!p.done&&p.date<today());if(w().route.lastAutoDate!==today()||overdue){const message=overdue?'Kaçırılan görevler günlük kapasiteye göre yeniden dağıtıldı.':'Bugünün rotası güncel verilerle kontrol edildi.';routeRebalance(message,true);w().route.lastAutoDate=today();save();}}

function routeTodayPage(){

function topicsPage(){const stages=[...new Set(subjects().map(s=>s.stage))];const query=ui.query.toLocaleLowerCase('tr-TR');const filtered=subjects().filter(s=>ui.stage==='all'||s.stage===ui.stage).map(s=>({...s,visible:s.topics.concat(w().customTopics.filter(t=>t.subjectId===s.id)).filter(t=>!query||(s.name+' '+t.title).toLocaleLowerCase('tr-TR').includes(query))})).filter(s=>s.visible.length);return head('KALDIĞIN YERİ KAYBETME','Konularım','Tamamlanmadı → çalışıyorum → tamamlandı. Durum simgesine basarak değiştir.',btn(icon('plus')+' Konu ekle','add-topic','primary'))+`<div class="toolbar"><div class="tabs">${['all',...stages].map(s=>`<button data-action="stage" data-stage="${s}" class="${ui.stage===s?'active':''}">${s==='all'?'Tümü':s}</button>`).join('')}</div><label class="search"><span class="sr-only">Konu veya ders ara</span><input id="topic-search" value="${esc(ui.query)}" placeholder="Konu veya ders ara…" aria-label="Konu veya ders ara"></label></div><div class="notice mb">Başlangıç konu listesi · Eksiksiz resmî müfredat değildir. Kendi kaynağındaki başlıkları ekleyebilir, her konuya bağlantı ve kaldığın dakikayı kaydedebilirsin.</div><div class="subject-grid">${filtered.map((s,index)=>{const ts=s.topics.concat(w().customTopics.filter(t=>t.subjectId===s.id));const n=ts.filter(t=>w().topicState[t.id]?.status===2).length;return `<details class="card subject-card" data-subject="${s.id}" ${query?'open':''}><summary><div class="row">${subIcon(s.id)}<div class="grow"><div class="eyebrow" style="font-size:8px">${s.stage}</div><h3 style="margin-top:3px;font-size:17px">${esc(s.name)}</h3></div><span class="muted tiny">${n} / ${ts.length}</span>${icon('chevron')}</div><div class="progress"><span style="width:${n/ts.length*100}%"></span></div></summary><div class="topic-list">${s.visible.map(t=>{const v=w().topicState[t.id]||{},status=v.status||0;return `<div class="topic-row"><button class="topic-state s${status}" data-action="topic-status" data-id="${t.id}" aria-la function seriesSvg(records){if(!records.length)return empty('Grafiğin ilk kaydını bekliyor.','Bir deneme eklediğinde netlerinin değişimini burada göreceksin.');const width=720,height=215,pad=38;const values=records.map(x=>R.calcNet(x.parts,x.penalty).net);const min=Math.min(0,...values),max=Math.max(10,...values)+5,span=max-min;const pts=values.map((v,i)=>[records.length===1?width/2:pad+i*(width-pad*2)/(records.length-1),height-pad-(v-min)/span*(height-pad*2)]);const line=pts.map(([x,y])=>`${x},${y}`).join(' ');const labels=Array.from({length:5},(_,i)=>min+(max-min)*i/4);return `<svg class="chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="${records.length} denemede net değişimi. Ayrıntılı değerler aşağıdaki tabloda.">${labels.map(v=>{const y=height-pad-(v-min)/span*(height-pad*2);return `<line class="grid" x1="${pad}" x2="${width-pad}" y1="${y}" y2="${y}"/><text x="6" y="${y+4}">${format(v,0)}</text>`;}).join('')}${pts.length>1?`<polygon class="area" points="${pts[0][0]},${height-pad} ${line} ${pts.at(-1)[0]},${height-pad}"/><polyline class="line" points="${line}"/>`:''}${pts.map(([x,y],i)=>`<circle class="point" cx="${x}" cy="${y}" r="5"><title>${esc(records[i].name)}: ${format(values[i],2)} net</title></circle>${i===0||i===pts.length-1||i%Math.max(1,Math.ceil(pts.length/5))===0?`<text x="${x}" y="${height-12}" text-anchor="middle">${dateLabel(records[i].date)}</text>`:''}`).join('')}</svg>`;}

function analysisPanel(records){

-exam','test-action ghost',`data-id="${x.id}" data-part="${p.index}"`)}</article>`).join('')}</div><div class="analysis-guidance">${icon('shield')}<span>Bu, aynı türdeki iki denemenin <strong>ham net farkıdır</strong>; tek başına öğrenme düzeyini veya gelişimi kanıtlamaz. Soru sayısı ya da net kuralı farklıysa fark hesaplanmaz. Toplam netten hangi konuda hata yaptığın çıkarılamaz; konuyu sen seçersin.</span></div><section class="analysis-notes"><div class="row between"><div><h3 style="font-size:18px">Bu denemeden tekrar listene</h3><p class="muted tiny" style="margin-top:6px">Yalnızca bu denemeye bağladığın yanlış notları.</p></div><span class="pill">${result.notes.length} not</span></div>${result.notes.length?result.notes.map((m,i)=>{const p=A.activeReview(w(),m.id);return `<article class="analysis-note"><span class="note-step">${m.resolved?icon('check'):String(i+1).padStart(2,'0')}</span><div class="grow"><h4>${esc(m.title)}</h4><div class="note-meta">${esc(subName(m.subjectId,true))} · ${esc(m.cause)}${p?' · '+p.minutes+' dk tekrar':''}</div></div>${reviewButton(m)}</article>`;}).join(''):'<div class="analysis-empty">Henüz bağlı konu yok. Yukarıdan <strong>“Yanlışı konuya bağla”</strong> seçeneğine bas; örneğin kendi yanlış yaptığın sorunun konusunu ve neden takıldığını kaydet. Sistem sen onaylamadan programına çalışma eklemez.</div>'}</section></div></section>`;
}

function teacherStatusText(s){return {open:'Yeni',solved:'Çözüldü',review:'Tekrar bakacağım',stuck:'Anlamadım'}[s]||'Yeni';}
function teacherTopics(subjectId){const sub=subject(subjectId);return sub?sub.topics.concat(w().customTopics.filter(t=>t.subjectId===subjectId)):[];}
function teacherTopicOptions(subjectId,selected=''){const list=teacherTopics(subjectId);return '<option value="">Konu seçmeden soracağım</option>'+list.map(t=>`<option value="${t.id}" ${selected===t.id?'selected':''}>${esc(t.title)}</option>`).join('');}
function normalizeTeacherText(v){return String(v||'').toLocaleLowerCase('tr-TR').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ı/g,'i').replace(/[^a-z0-9\s]/gi,' ').replace(/\s+/g,' ').trim();}
function inferTeacherTopic(subjectId,text){const q=normalizeTeacherText(text);if(!q)return '';
 const list=teacherTopics(subjectId).map(t=>({t,n:normalizeTeacherText(t.title),tokens:normalizeTeacherText(t.title).split(' ').filter(x=>x.length>2)}));
 let best=null,score=0;for(const x of list){let n=0;if(x.n&&q.includes(x.n))n+=6;for(const token of x.tokens)if(q.includes(token))n++;if(n>score){score=n;best=x.t;}}
 return score>=1?best?.id||'':'';
}
function teacherMode(subjectId){const name=(subject(subjectId)?.name||'').toLocaleLowerCase('tr-TR');if(/matematik|geometri|fizik|kimya/.test(name))return 'quant';if(/türkçe|edebiyat|yabancı dil/.test(name))return 'language';return 'social';}
function teacherDiagnosis(record){const q=normalizeTeacherText(record.question),mode=teacherMode(record.subjectId);if(record.photo&&!record.question.trim())return 'Fotoğraf eklendi; bu yerel prototip görseli saklıyor ancak henüz gerçek görsel yapay zekâ modeliyle okumuyor. Canlı model bağlantısında görsel doğrudan analiz edilecek.';if(/değildir|degildir|hangisi|hangisidir/.test(q))return 'Soru kökünde eleme ve karşılaştırma gerekiyor gibi görünüyor. Önce neyin istendiğini netleştirip seçenekleri kanıtla eşleştirelim.';if(/neden|niçin|nicin|sebep/.test(q))return 'Buradaki düğüm büyük ihtimalle neden–sonuç bağını kurmak. Ezberden önce ilişkinin nedenini görünür hâle getirelim.';if(mode==='quant')return 'Bu tip sorularda en sık takılma noktası, verilen bilgiyi doğru matematiksel ilişkiye çevirmek veya işlem sırasını korumaktır.';if(mode==='language')return 'Bu tip sorularda asıl güçlük çoğu zaman bağlamı kaçırmak ya da soru kökünün istediği ayrımı netleştirememektir.';return 'Bu soruda kavramları birbirinden ayırıp zaman–yer–neden–sonuç ilişkisini kurmak çözümü belirginleştirebilir.';}

function teacherMathExpression(text){
 const raw=String(text||'').replace(/[×·]/g,'*').replace(/÷/g,'/').replace(/[−–—]/g,'-');
 const matches=raw.match(/[0-9.,()+\-*/^\s]+/g)||[];
 let best='';
 for(const part of matches){const x=part.trim();if(/[0-9]/.test(x)&&/[+\-*/^]/.test(x)&&x.length>best.length)best=x;}
 if(!best)return '';
 return best.replace(/(\d),(\d)/g,'$1.$2').replace(/\s+/g,'');
}
function teacherCalcExpression(expr){
 let i=0;
 const fail=()=>{throw Error('Geçersiz işlem');};
 const peek=()=>expr[i]||'';
 const eat=c=>{if(peek()===c){i++;return true;}return false;};
 function number(){let start=i,dots=0;while(/[0-9.]/.test(peek())){if(peek()==='.'&&++dots>1)fail();i++;}if(start===i)fail();const n=Number(expr.slice(start,i));if(!Number.isFinite(n))fail();return n;}
 function primary(){if(eat('(')){const v=add();if(!eat(')'))fail();return v;}return number();}
 function unary(){if(eat('+'))return unary();if(eat('-'))return -unary();return primary();}
 function power(){let v=unary();if(eat('^'))v=Math.pow(v,power());if(!Number.isFinite(v))fail();return v;}
 function mul(){let v=power();while(true){if(eat('*'))v*=power();else if(eat('/')){const d=power();if(Math.abs(d)<1e-15)throw Error('Sıfıra bölme tanımsızdır');v/=d;}else break;if(!Number.isFinite(v))fail();}return v;}
 function add(){let v=mul();while(true){if(eat('+'))v+=mul();else if(eat('-'))v-=mul();else break;if(!Number.isFinite(v))fail();}return v;}
 const value=add();if(i!==expr.length)fail();return value;
}
function teacherNumber(n){if(Math.abs(n)<1e-12)n=0;const rounded=Math.abs(n-Math.round(n))<1e-12?Math.round(n):Number(n.toFixed(8));return rounded.toLocaleString('tr-TR',{maximumFractionDigits:8});}
function teacherLocalMath(record,variant='base'){
 const expr=teacherMathExpression(record.question);if(!expr)return null;
 let value;try{value=teacherCalcExpression(expr);}catch(e){if(e.message==='Sıfıra bölme tanımsızdır')return {kind:'solution',diagnosis:'Bu işlemde sıfıra bölme var.',steps:[{title:'Kural',text:'Bir sayı 0’a bölünemez; bu işlem tanımsızdır.'}],summary:'Sonuç: tanımsız.'};return null;}
 const pretty=expr.replace(/\*/g,' × ').replace(/\//g,' ÷ ').replace(/\+/g,' + ').replace(/-/g,' − ').replace(/\^/g,' ^ '),answer=teacherNumber(value);
 if(variant==='simple')return {kind:'solution',diagnosis:'Bu doğrudan bir işlem sorusu.',steps:[{title:'Tek adım',text:`${pretty} = ${answer}`}],summary:`Cevap: ${answer}`};
 if(variant==='alternate')return {kind:'solution',diagnosis:'Aynı sonucu işlem önceliğini koruyarak kontrol edelim.',steps:[{title:'İfadeyi oku',text:`İşlem: ${pretty}`},{title:'Kontrol et',text:'Önce parantez ve üs, sonra çarpma-bölme, en son toplama-çıkarma yapılır.'},{title:'Sonuç',text:`Hesaplandığında ${answer} elde edilir.`}],summary:`Cevap: ${answer}`};
 return {kind:'solution',diagnosis:'Bu soru doğrudan hesaplanabilir bir matematik işlemi.',steps:[{title:'İşlemi belirle',text:`Verilen ifade: ${pretty}`},{title:'İşlem önceliğini uygula',text:'Varsa parantez ve üsleri; sonra çarpma-bölmeyi; en son toplama-çıkarmayı yap.'},{title:'Hesapla',text:`${pretty} = ${answer}`}],summary:`Cevap: ${answer}`};
}

function teacherSmalltalk(text){
 const q=normalizeTeacherText(text);if(!q)return null;
 if(/^(merhaba|selam|selamlar|hey|sa|gunaydin|iyi aksamlar|iyi geceler)\b/.test(q))return 'Merhaba 👋 Hazırım. İstersen bir ders sorusu sor, istersen soru fotoğrafını ekle.';
 if(/\b(nasilsin|iyi misin|naber|ne haber)\b/.test(q))return 'İyiyim, teşekkür ederim 🙂 Buradayım. Sen nasılsın? Dersle ilgili bir yerde takıldıysan beraber bakalım.';
 if(/\b(tesekkur|tesekkurler|sag ol|sagol|eyvallah)\b/.test(q))return 'Rica ederim 🙂 Takıldığın yerde yeniden sorabilirsin.';
 if(/\b(sen kimsin|kimsin|adin ne)\b/.test(q))return 'Ben Rota Hoca; Çalışma Rotası içindeki yapay zekâ eğitim asistanıyım. Gerçek bir öğretmen değilim.';
 if(/\b(ne yapabilirsin|neler yaparsin|ne ise yararsin)\b/.test(q))return 'Ders sorularını adım adım açıklamak, soru geçmişini tutmak ve zorlandığın konuyu çalışma planına bağlamak için tasarlandım. Bu yerel prototipte gerçek AI bağlı değilse bilmediğim cevabı uydurmam.';
 if(/\b(gorusuruz|hosca kal|bay bay|bye)\b/.test(q))return 'Görüşürüz 👋 Çalışmana döndüğünde burada olacağım.';
 return null;
}
function teacherStudyCoach(record){
 const q=normalizeTeacherText(record.question);if(!/(nasil calis|nasil tekrar|konuyu nasil|motivasyon|ezber|calisma program)/.test(q))return null;
 const sub=subject(record.subjectId),topic=R.topic(w(),record.topicId),name=topic?.title||sub?.name||'bu konu';
 return {kind:'coach',diagnosis:`${name} için amaç tek seferde uzun çalışmak değil; kısa tekrarlarla bilgiyi geri çağırmak.`,steps:[{title:'Kısa anlatım',text:`Önce ${name} konusunun temel kuralını 10–15 dakikada gözden geçir.`},{title:'Aktif hatırlama',text:'Kaynağı kapatıp bildiklerini kendi cümlelerinle yaz; eksik kalan yere geri dön.'},{title:'Soru uygula',text:'Kolaydan ortaya 10–20 soru çöz ve yanlışının nedenini bir cümleyle not et.'},{title:'Tekrar planla',text:'Yanlış çıkan noktayı 1–3 gün içinde kısa bir tekrar oturumuna koy.'}],summary:'Kısa konu tekrarı + aktif hatırlama + soru çözümü + planlı geri dönüş.'};
}

function teacherKnowledgeMatch(q,fact){return fact.match.some(group=>group.every(token=>q.includes(normalizeTeacherText(token))));}
function teacherKnowledgeAnswer(record){const q=normalizeTeacherText(record.question);if(!q)return null;const fact=TEACHER_KNOWLEDGE.find(x=>teacherKnowledgeMatch(q,x));if(!fact)return null;return {kind:'fact',diagnosis:'Bu doğrudan bilgi sorusu. Önce net cevabı verip kısa bağlamı ekleyeyim.',steps:[{title:'Cevap',text:fact.answer},{title:'Kısa bağlam',text:fact.context}],summary:fact.answer,sourceLabel:fact.subject};}

function teacherBoundaryAnswer(record){
 const sub=subject(record.subjectId),topic=R.topic(w(),record.topicId),label=topic?.title||sub?.name||'seçtiğin ders';
 return {kind:'boundary',message:`Bu sorunun doğru cevabını şu anki yerel prototipte güvenilir biçimde üretemem. ${label} için gerçek yapay zekâ modeli bağlı olmadan tahmin yürütmeyeceğim. Temel matematik işlemlerini çözebilirim; gerçek AI backend bağlandığında metin ve fotoğraf sorularını da içerikten okuyarak çözeceğim.`};
}
function teacherAnswer(record,variant='base'){
 const smalltalk=teacherSmalltalk(record.question);if(smalltalk)return {kind:'chat',message:smalltalk};
 const localMath=teacherLocalMath(record,variant);if(localMath)return localMath;
 const coach=teacherStudyCoach(record);if(coach)return coach;
 const knowledge=teacherKnowledgeAnswer(record);if(knowledge)return knowledge;
 const sub=subject(record.subjectId),topic=R.topic(w(),record.topicId);
 if(record.photo&&!record.question.trim())return {kind:'boundary',message:`Fotoğrafın eklendi. Ancak bu yerel prototipte görseli gerçekten okuyacak model bağlı değil; fotoğrafa bakıyormuş gibi cevap uydurmayacağım. Seçili alan: ${sub?.name||'Ders'}${topic?' · '+topic.title:''}. Gerçek çok-modlu AI bağlandığında görsel doğrudan analiz edilecek.`};
 return teacherBoundaryAnswer(record);
}
function similarTeacherQuestion(record){const sub=subject(record.subjectId),topic=R.topic(w(),record.topicId),name=topic?.title||sub?.name||'aynı konu';const mode=teacherMode(record.subjectId);if(mode==='quant')return `${name} için benzer çalışma: Verilenleri ve isteneni kendin belirleyebileceğin küçük bir örnek kur. Önce ilişkiyi yaz, sonra işlemi yap. Çözümünü bitirdiğinde “hangi adım en çok zaman aldı?” sorusuna da cevap ver.`;if(mode==='language')return `${name} için benzer çalışma: Aynı kazanımı ölçen kısa bir cümle veya paragraf seç. Soru kökündeki anahtar kelimeyi işaretle ve iki yakın seçenek arasındaki farkı bir cümleyle açıkla.`;return `${name} için benzer çalışma: Aynı kavramla ilgili iki bilgi yaz; birini doğru, birini yanıltıcı yap. Sonra aralarındaki farkı neden–sonuç veya kavram ilişkisiyle açıkla.`;}
function teacherActive(){return teacherTransient?.id===ui.teacherActiveId?teacherTransient:teacherQuestions().find(q=>q.id===ui.teacherActiveId)||null;}
function teacherRepeatGroups(){const map=new Map();for(const q of teacherQuestions().filter(q=>['review','stuck'].includes(q.status))){const key=q.topicId||'sub:'+q.subjectId;const item=map.get(key)||{key,subjectId:q.subjectId,topicId:q.topicId||'',count:0};item.count++;map.set(key,item);}return [...map.values()].filter(x=>x.count>=2).sort((a,b)=>b.count-a.count);}
function teacherRecommendation(){const g=teacherRepeatGroups()[0];if(!g)return '';const title=g.topicId?R.topic(w(),g.topicId)?.title:subName(g.subjectId);return `<section class="teacher-recommend">${subIcon(g.subjectId)}<div class="grow"><h3>${esc(title||'Bu ders')} için tekrar sinyali var.</h3><p>${g.count} soru “Anlamadım” veya “Tekrar bakacağım” olarak işaretlenmiş. Kısa bir tekrar oturumu planına ekleyebilirsin.</p></div>${btn('Tekrarı planla','teacher-plan-group','sm primary',`data-subject="${g.subjectId}" data-topic="${g.topicId}"`)}</section>`;}
function teacherAnswerText(record){const a=record.answer||teacherAnswer(record);return [a.direct_answer,a.message,a.diagnosis,...(a.steps||[]).map(x=>x.title+'. '+x.text),a.summary,...(record.followups||[]).map(x=>x.title+'. '+x.text)].filter(Boolean).join(' ');}

function teacherKnownVoiceGender(v){const n=(' '+(v.name||'')+' ').toLocaleLowerCase('tr-TR');const male=['cem','tolga','ahmet','mehmet','murat','emre','hakan','kerem','mert','onur','ozan','baris','barış','yilmaz','yılmaz','male','erkek'];const female=['yelda','emel','aylin','ayşe','ayse','filiz','seda','zeynep','fatma','ece','female','kadin','kadın'];if(male.some(x=>n.includes(x)))return 'male';if(female.some(x=>n.includes(x)))return 'female';return 'unknown';}
function teacherTurkishVoices(){if(!('speechSynthesis'in window))return [];return window.speechSynthesis.getVoices().filter(v=>(v.lang||'').toLowerCase().startsWith('tr'));}
function teacherMaleTurkishVoices(){return teacherTurkishVoices().filter(v=>teacherKnownVoiceGender(v)==='male');}
function teacherVoiceScore(v){const n=(v.name||'').toLocaleLowerCase('tr-TR');let score=100;const gender=teacherKnownVoiceGender(v);if(gender==='male')score+=120;if(gender==='female')score-=500;if(/premium|enhanced|neural|natural/.test(n))score+=35;if(/microsoft|apple|google/.test(n))score+=15;if(/ahmet|cem|tolga/.test(n))score+=35;if(v.localService)score+=3;return score;}
function teacherBestTurkishVoice(){const males=teacherMaleTurkishVoices();if(!males.length)return null;const saved=males.find(v=>v.name===teacherVoice.voiceName);if(saved)return saved;return [...males].sort((a,b)=>teacherVoiceScore(b)-teacherVoiceScore(a))[0]||null;}
function teacherVoiceOptions(){const males=teacherMaleTurkishVoices(),best=teacherBestTurkishVoice();if(!males.length)return '<option value="">Bu cihazda erkek Türkçe ses bulunamadı</option>';return males.map(v=>`<option value="${esc(v.name)}" ${best?.name===v.name?'selected':''}>${esc(v.name)} · ${esc(v.lang)}</option>`).join('');}
function teacherRefreshVoiceSelect(){const select=$('#teacher-voice-select');if(!select)return;select.innerHTML=teacherVoiceOptions();select.disabled=!teacherMaleTurkishVoices().length;const best=teacherBestTurkishVoice();if(best){teacherVoice.voiceName=best.name;saveTeacherVoice();select.value=best.name;}const guard=$('#teacher-voice-guard');if(guard)guard.innerHTML=best?'<strong>Erkek Türkçe ses seçildi.</strong> Cihazdaki ses motoru kullanılıyor.':'<strong>Erkek Türkçe ses yok.</strong> Kadın sese düşmek yerine sesli anlatım kapalı kalır.';}

let teacherBackend={checked:false,checking:false,ai:false,tts:false,model:'',profile:'best',ttsModel:'',error:'',configurable:false,demoFallback:false};
function teacherProfileLabel(p){return p==='best'?'En güçlü':p==='balanced'?'Dengeli':'Ekonomik';}
function teacherBackendLabel(){if(location.protocol==='file:')return 'Gerçek AI için BASLAT.command ile aç.';if(teacherBackend.checking)return 'AI bağlantısı kontrol ediliyor…';if(teacherBackend.ai)return 'Gerçek AI · '+(teacherBackend.model||'model');return teacherBackend.error||'AI sunucusu bağlı değil.';}
function teacherUpdateBackendUI(){
 const n=$('#teacher-backend-state');if(n){n.textContent=teacherBackendLabel();n.classList.toggle('is-live',teacherBackend.ai);n.classList.toggle('teacher-backend-live',teacherBackend.ai);}
 const note=$('#teacher-backend-note');if(note){note.innerHTML=teacherBackend.ai?`<strong>AI bağlantısı açık.</strong> ${esc(teacherBackend.model)} · ${esc(teacherProfileLabel(teacherBackend.profile))}.${teacherBackend.demoFallback?' <strong> Kredi yoksa ücretsiz Demo Test Modu otomatik devreye girer; demo cevaplar gerçek AI değildir.</strong>':''} Metin ve fotoğraf soruları sunucu üzerinden çözülür.`:(`<strong>Gerçek AI henüz bağlı değil.</strong> ${esc(teacherBackend.error||'Bağlantıyı kurduğunda ders ve fotoğraf soruları gerçek modele gider.')}${teacherBackend.configurable?' <button type="button" class="btn sm primary teacher-connect-btn" data-action="teacher-connect">AI bağlantısını kur</button>':''}`);}
 const guard=$('#teacher-voice-guard');if(guard)guard.innerHTML=teacherBackend.tts?`<strong>Bulut sesi hazır.</strong> ${teacherVoice.gender==='female'?'Kadın':'Erkek'} öğretmen stili seçili; tercih kendiliğinden değişmez.`:'<strong>Bulut sesi bağlı değil.</strong> Tarayıcıdaki rastgele sistem sesine düşülmez.';
}
async function teacherCheckBackend(force=false){
 if(location.protocol==='file:'){teacherBackend={...teacherBackend,checked:true,ai:false,tts:false,error:'BASLAT.command ile açmadan gerçek AI çalışmaz.'};teacherUpdateBackendUI();return teacherBackend;}
 if(teacherBackend.checking||teacherBackend.checked&&!force)return teacherBackend;
 teacherBackend.checking=true;teacherUpdateBackendUI();
 try{const r=await fetch('/api/health',{cache:'no-store'});const j=await r.json();teacherBackend={checked:true,checking:false,ai:!!j.aiConfigured,tts:!!j.ttsConfigured,model:j.model||'',profile:j.profile||'best',ttsModel:j.ttsModel||'',configurable:!!j.configurable,demoFallback:!!j.demoFallback,error:j.aiConfigured?'':'Gerçek AI bağlantısı henüz kurulmadı.'};}
 catch(e){teacherBackend={checked:true,checking:false,ai:false,tts:false,model:'',profile:'best',ttsModel:'',configurable:false,error:'AI sunucusuna ulaşılamadı.'};}
 teacherUpdateBackendUI();return teacherBackend;
}
function teacherOpenConfigure(){
 if(location.protocol==='file:')return toast('Gerçek AI için ZIP içindeki BASLAT.command dosyasını aç.',true);
 openModal('Rota Hoca AI bağlantısı',`<form id="teacher-config-form" class="teacher-connect-form"><p class="dialog-desc">OpenAI API anahtarı yalnızca bu bilgisayardaki yerel sunucu belleğine gider. HTML, tarayıcı kaydı veya uygulama yedeğine yazılmaz; sunucu kapanınca unutulur.</p><div class="form-grid"><label class="field full">OpenAI API anahtarı<input name="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="sk-…" required></label><label class="field">AI gücü<select name="profile"><option value="best" ${teacherBackend.profile==='best'?'selected':''}>En güçlü · GPT-6 Astra öncelikli</option><option value="balanced" ${teacherBackend.profile==='balanced'?'selected':''}>Dengeli · GPT-5.6 Sol öncelikli</option><option value="economy" ${teacherBackend.profile==='economy'?'selected':''}>Ekonomik · GPT-5.6 Terra öncelikli</option></select></label><label class="field">Ses tercihi<select name="gender"><option value="male" ${teacherVoice.gender==='male'?'selected':''}>Erkek öğretmen stili</option><option value="female" ${teacherVoice.gender==='female'?'selected':''}>Kadın öğretmen stili</option></select></label><label class="check-chip full"><input type="checkbox" name="autoRead" ${teacherVoice.autoRead?'checked':''}>Yeni cevapları otomatik seslendir</label></div><div class="notice mt">En güçlü mod, zor soru ve fotoğraflarda daha yüksek kaliteyi hedefler. API kullanımı ChatGPT aboneliğinden ayrı olarak API hesabında ücretlendirilebilir.</div><div class="form-error" role="alert"></div><div class="button-row">${btn('Vazgeç','close-modal','ghost')}<button class="btn primary" type="submit">Bağlantıyı doğrula</button></div></form>`);
}
async function teacherConfigureAI(form){
 const err=$('.form-error',form),button=form.querySelector('button[type=submit]');
 try{const f=new FormData(form),key=String(f.get('apiKey')||'').trim(),profile=String(f.get('profile')||'best');if(key.length<20)throw Error('Geçerli bir API anahtarı gir.');teacherVoice.gender=f.get('gender')==='female'?'female':'male';teacherVoice.autoRead=!!f.get('autoRead');saveTeacherVoice();button.disabled=true;button.textContent='Doğrulanıyor…';const r=await fetch('/api/configure',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({apiKey:key,profile})});let j={};try{j=await r.json()}catch{}if(!r.ok)throw Error(j.error||'AI bağlantısı kurulamadı.');closeModal();teacherBackend.checked=false;await teacherCheckBackend(true);render();toast('Rota Hoca gerçek AI bağlantısı hazır · '+(j.model||teacherBackend.model));}
 catch(e){if(err)err.textContent=e.message||'Bağlantı kurulamadı.';}
 finally{if(button){button.disabled=false;button.textContent='Bağlantıyı doğrula';}}
}
function teacherStudentContext(record){const ww=w();const recentExams=[...ww.exams].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3).map(x=>{let net=null;try{net=R.calcNet(x.parts,x.penalty).net}catch{}return {date:x.date,type:x.type,name:x.name,net};});const recentMistakes=ww.mistakes.filter(m=>!m.resolved).slice(0,8).map(m=>({subject:subName(m.subjectId,true),topic:R.topic(ww,m.topicId)?.title||m.title,cause:m.cause,reviewDate:m.reviewDate}));const recentLogs=[...ww.logs].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10).map(l=>({date:l.date,subject:subName(l.subjectId,true),minutes:l.minutes,questions:l.questions,title:l.title}));const teacherSignals=teacherQuestions().filter(q=>['review','stuck'].includes(q.status)).slice(0,8).map(q=>({subject:subName(q.subjectId,true),topic:R.topic(ww,q.topicId)?.title||'',status:q.status,question:q.question.slice(0,180)}));return {exam:examLabel(),track:trackLabel(),target:ww.settings.target||'',targetDate:ww.settings.targetDate||'',dailyMinutes:ww.settings.dailyMinutes,topicStatus:record.topicId?(ww.topicState[record.topicId]?.status||0):null,recentExams,recentMistakes,recentLogs,teacherSignals};}
function teacherRemoteText(a){return [a?.direct_answer,a?.message,a?.diagnosis,...(a?.steps||[]).map(x=>x.title+': '+x.text),a?.summary].filter(Boolean).join('\n');}
function teacherMapDetectedSubject(name){if(!name)return '';const n=normalizeTeacherText(name);return subjects().find(s=>{const sn=normalizeTeacherText(s.name);return n===sn||n.includes(sn)||sn.includes(n);})?.id||'';}
function teacherMapDetectedTopic(subjectId,name){if(!subjectId||!name)return '';const n=normalizeTeacherText(name);return R.allTopics(w(),state.activeExam).filter(t=>t.subjectId===subjectId).find(t=>{const tn=normalizeTeacherText(t.title);return n===tn||n.includes(tn)||tn.includes(n);})?.id||'';}
async function teacherSolveRemote(record,mode='base',previousAnswer=null){const status=await teacherCheckBackend();if(!status.ai)throw Error(status.error||'Gerçek AI bağlı değil.');const topic=R.topic(w(),record.topicId),sub=subject(record.subjectId);const r=await fetch('/api/teacher',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({question:record.question||'',photo:record.photo||'',exam:examLabel(),track:trackLabel(),subject:subName(record.subjectId,true),topic:topic?.title||'',mode,previousAnswer,studentContext:teacherStudentContext(record)})});let j={};try{j=await r.json()}catch{}if(!r.ok)throw Error(j.error||'Rota Hoca AI isteği başarısız.');if(!j.answer)throw Error('Rota Hoca cevap döndürmedi.');if(j.demo){j.answer._demo=true;j.answer._demo_reason=j.demoReason||'Gerçek AI kullanılmadı.';}return j.answer;}

function teacherVoiceName(){const v=teacherBestTurkishVoice();return v?`${v.name} · ${v.lang}`:'Erkek Türkçe ses bulunamadı';}
function teacherSetMouthLevel(level){}
function teacherSetSpeaking(on,tts='browser'){teacherSpeech.active=!!on;teacherSpeech.tts=tts||'browser';const stage=$('#teacher-avatar-stage');if(stage){stage.classList.toggle('is-speaking',!!on);stage.dataset.tts=teacherSpeech.tts;const label=$('#teacher-avatar-status');if(label)label.textContent=on?'Konuşuyorum…':'Hazırım';if(!on)teacherSetMouthLevel(.16);}$$('[data-action=teacher-speak]').forEach(b=>b.classList.toggle('is-speaking',!!on));}
function teacherAfterRender(){teacherUpdateBackendUI();if(!teacherBackend.checked&&!teacherBackend.checking)setTimeout(()=>teacherCheckBackend(),0);if(teacherSpeech.active)teacherSetSpeaking(true,teacherSpeech.tts);}
function teacherStopSpeaking(quiet=false){try{window.speechSynthesis?.cancel();}catch{}if(teacherSpeech.audio){try{teacherSpeech.audio.pause();teacherSpeech.audio.src='';}catch{}}if(teacherSpeech.raf)cancelAnimationFrame(teacherSpeech.raf);try{teacherSpeech.source?.disconnect();teacherSpeech.analyser?.disconnect();teacherSpeech.ctx?.close();}catch{}if(teacherSpeech.url&&teacherSpeech.url.startsWith('blob:'))try{URL.revokeObjectURL(teacherSpeech.url);}catch{}teacherSpeech={active:false,id:'',utterance:null,audio:null,ctx:null,source:null,analyser:null,raf:0,url:'',tts:'browser'};teacherSetSpeaking(false);if(!quiet)toast('Sesli anlatım durduruldu.');}
function teacherProviderSource(output){if(!output)return null;if(output instanceof Blob)return {url:URL.createObjectURL(output),revoke:true};if(output instanceof ArrayBuffer)return {url:URL.createObjectURL(new Blob([output],{type:'audio/mpeg'})),revoke:true};if(typeof output==='string')return {url:output,revoke:false};if(output.audio instanceof Blob)return {url:URL.createObjectURL(output.audio),revoke:true};if(output.audio instanceof ArrayBuffer)return {url:URL.createObjectURL(new Blob([output.audio],{type:output.type||'audio/mpeg'})),revoke:true};if(typeof output.url==='string')return {url:output.url,revoke:false};return null;}
async function teacherPlayProviderAudio(source,id){teacherStopSpeaking(true);const a=new Audio(source.url);a.preload='auto';a.playsInline=true;teacherSpeech={...teacherSpeech,active:true,id,audio:a,url:source.url,tts:'provider'};teacherSetSpeaking(true,'provider');let analyser=null,ctx=null,src=null,data=null,last=0;try{const AC=window.AudioContext||window.webkitAudioContext;if(AC){ctx=new AC();src=ctx.createMediaElementSource(a);analyser=ctx.createAnalyser();analyser.fftSize=256;src.connect(analyser);analyser.connect(ctx.destination);data=new Uint8Array(analyser.frequencyBinCount);teacherSpeech.ctx=ctx;teacherSpeech.source=src;teacherSpeech.analyser=analyser;const frame=(ts)=>{if(!teacherSpeech.active||teacherSpeech.audio!==a)return;if(ts-last>32){last=ts;analyser.getByteTimeDomainData(data);let sum=0;for(const x of data){const d=(x-128)/128;sum+=d*d;}const rms=Math.sqrt(sum/data.length);teacherSetMouthLevel(.18+Math.min(1,rms*5));}teacherSpeech.raf=requestAnimationFrame(frame)};teacherSpeech.raf=requestAnimationFrame(frame);}}catch{}
 a.onended=()=>{if(teacherSpeech.audio===a)teacherStopSpeaking(true);};a.onerror=()=>{if(teacherSpeech.audio===a){teacherStopSpeaking(true);toast('Bulut sesi oynatılamadı. Cihazdaki farklı bir sese otomatik geçmedim.',true);}};await a.play();}
async function teacherSpeak(id,opts={}){const q=teacherTransient?.id===id?teacherTransient:teacherQuestions().find(x=>x.id===id);if(!q)return;const latest=opts.onlyLatest&&q.followups?.length?q.followups.at(-1).title+'. '+q.followups.at(-1).text:'';const text=(latest||teacherAnswerText(q)).replace(/\n+/g,' ').slice(0,4096);teacherStopSpeaking(true);teacherSpeech.id=id;try{const status=await teacherCheckBackend();if(!status.tts)throw Error('Kaliteli ses sunucusu bağlı değil.');const r=await fetch('/api/tts',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text,gender:teacherVoice.gender})});if(!r.ok){let j={};try{j=await r.json()}catch{}throw Error(j.error||'Ses üretilemedi.');}const source=teacherProviderSource(await r.blob());if(!source)throw Error('Ses verisi alınamadı.');await teacherPlayProviderAudio(source,id);if(!opts.auto)toast((teacherVoice.gender==='female'?'Kadın':'Erkek')+' öğretmen stiliyle anlatılıyor.');}catch(e){teacherSetSpeaking(false);toast(e.message||'Sesli anlatım başlatılamadı.',true);}}
async function teacherPreviewVoice(){try{const status=await teacherCheckBackend();if(!status.tts){teacherOpenConfigure();throw Error('Önce AI ve ses bağlantısını kur.');}teacherStopSpeaking(true);teacherSpeech.id='preview';const sample=teacherVoice.gender==='female'?'Merhaba. Ben Rota Hoca. Sorunu birlikte, sakin sakin çözelim.':'Merhaba. Ben Rota Hoca. Sorunu birlikte, sakin sakin çözelim.';const r=await fetch('/api/tts',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text:sample,gender:teacherVoice.gender})});if(!r.ok){let j={};try{j=await r.json()}catch{}throw Error(j.error||'Ses önizlemesi üretilemedi.');}const source=teacherProviderSource(await r.blob());await teacherPlayProviderAudio(source,'preview');}catch(e){teacherSetSpeaking(false);toast(e.message||'Ses önizlemesi başlatılamadı.',true);}}
function teacherAnswerCard(record){

function compressTeacherPhoto(file){return new Promise((resolve,reject)=>{if(!file||!file.type.startsWith('image/'))return reject(Error('Bir fotoğraf seç.'));if(file.size>10*1024*1024)return reject(Error('Fotoğraf en fazla 10 MB olabilir.'));const r=new FileReader();r.onerror=()=>reject(Error('Fotoğraf okunamadı.'));r.onload=()=>{const img=new Image();img.onerror=()=>reject(Error('Fotoğraf açılamadı.'));img.onload=()=>{if(img.width<280||img.height<180)return reject(Error('Fotoğraf çözünürlüğü çok düşük. Soruyu daha yakından ve net çek.'));const draw=(max,q)=>{const scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));const ctx=c.getContext('2d');ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q);};resolve({full:draw(1600,.88),thumb:draw(520,.72),width:img.width,height:img.height});};img.src=r.result;};r.readAsDataURL(file);});}

function readSettings(form){const f=new FormData(form),days=f.getAll('days').map(Number),dailyMinutes=Number(f.get('dailyMinutes')),track=String(f.get('track'));if(!days.length)throw Error('En az bir çalışma günü seç.');if(!Number.isInteger(dailyMinutes)||dailyMinutes<30||dailyMinutes>720)throw Error('Günlük süreyi kontrol et.');if(state.activeExam==='yks'&&!C.TRACKS[track])throw Error('Geçerli bir YKS alanı seç.');const targetDate=String(f.get('targetDate')||'');if(targetDate&&!R.validDate(targetDate))throw Error('Geçerli bir hedef tarihi seç.');return {name:String(f.get('name')||'').trim().slice(0,60),track:state.activeExam==='yks'?track:'lisans',dailyMinutes,days,priorities:f.getAll('priorities').filter(x=>subjects().some(s=>s.id===x)),target:String(f.get('target')||'').trim().slice(0,160),targetDate};}
function openLog(existing=null,session=null,fromTimer=false){const t=timer();const initial=existing||{subjectId:session?.subjectId||(fromTimer?t.subjectId:subjects()[0].id),date:today(),title:session?.title||'',minutes:fromTimer?Math.min(t.duration,Math.floor((t.duration*60-remaining(t))/60)):session?.minutes||25,questions:0,note:'',sessionId:session?.id||''};ui.formContext={kind:'log',editId:existing?.id||'',sessionId:initial.sessionId||'',fromTimer};openModal(existing?'Çalışmanı düzenle':'Çalışmanı kaydet',`<form id="log-form"><div class="form-grid"><label class="field">Ders<select name="subjectId">${subOptions(initial.subjectId)}</select></label><label class="field">Çalışma tarihi<input type="date" name="date" value="${initial.date}" max="${today()}" required></label><label class="field full">Konu / yaptığın çalışma<input name="title" value="${esc(initial.title)}" maxlength="180" placeholder="Örneğin: Paragraf soru çözümü"></label><label class="field">Çalışma süresi (dakika)<input type="number" name="minutes" value="${initial.minutes}" min="0" max="1440" step="1" required></label><label class="field">Çözülen soru sayısı<input type="number" name="questions" value="${initial.questions}" min="0" max="5000" step="1" required></label><label class="field full">Kısa not (isteğe bağlı)<textarea name="note" maxlength="2000">${esc(initial.note)}</textarea></label>${initial.sessionId?`<label class="check-chip full"><input type="checkbox" name="completeSession" ${initial.minutes>=(session?.minutes||25)?'checked':''}>Bağlı plan oturumunu tamamlandı olarak işaretle</label>`:''}</div><div class="notice mt">Bu kayıt ${examLabel()} alanına eklenir. Bir oturumu tamamlamak konuyu otomatik bitirmez; konu durumunu ayrıca değiştirebilirsin.</div><div class="form-error" role="alert"></div><div class="button-row">${btn('Vazgeç','close-modal','ghost')}<button class="btn primary" type="submit">Kaydet ${icon('check')}</button></div></form>`);}
function openSource(id){const topic=R.topic(w(),id);if(!topic)return;const t=w().topicState[id]||{};ui.formContext={kind:'source',topicId:id};openModal('Kaynağını ve kaldığın yeri kaydet',`<p class="small muted mb">${esc(topic.title)}</p><form id="source-form"><div class="form-grid"><label class="field full">Kaynak bağlantısı<input type="url" name="url" value="${esc(t.url||'')}" placeholder="https://…" maxlength="2000"><span class="field-help">Yalnızca http / https bağlantıları kabul edilir.</span></label><label class="field">Kaldığın dakika<input type="number" name="position" value="${t.position||0}" min="0" max="100000" step="1"></label><label class="field">Konu durumu<select name="status">${['Başlanmadı','Çalışıyorum','Tamamlandı'].map((s,i)=>`<option value="${i}" ${(t.status||0)===i?'selected':''}>${s}</option>`).join('')}</select></label><label class="field full">Kaynak / sayfa / çalışma notun<textarea name="note" maxlength="4000">${esc(t.note||'')}</textarea></label></div><div class="form-error" role="alert"></div><div class="button-row">${R.resourceUrl(t.url,t.position)?`<a class="btn ghost" href="${esc(R.resourceUrl(t.url,t.position))}" target="_blank" rel="noopener noreferrer">Kaynağı aç ↗</a>`:''}<button type="submit" class="btn primary">Kaydet ${icon('check')}</button></div></form>`);}
function openTopic(){ui.formContext={kind:'topic'};openModal('Kendi konunu ekle',`<form id="topic-form"><div class="form-grid"><label class="field full">Ders<select name="subjectId">${subOptions()}</select></label><label class="field full">Konu başlığı<input name="title" maxlength="180" required placeholder="Kaynağındaki konu başlığını yaz"></label></div><div class="form-error" role="alert"></div><div class="button-row"><button class="btn primary" type="submit">Konuyu ekle ${icon('plus')}</button></div></form>`);}
function mockRows(parts){return `<div class="table-wrap"><table class="mock-inputs"><thead><tr><th>TEST</th><th>SORU</th><th>DOĞRU</th><th>YANLIŞ</th><th>BOŞ</th></tr></thead><tbody>${parts.map((p,i)=>`<tr data-part="${i}"><td class="part-label">${esc(p.label)}</td><td><input aria-label="${esc(p.label)} soru sayısı" data-field="total" type="number" value="${p.total}" min="1" max="1000" step="1" required></td><td><input aria-label="${esc(p.label)} doğru" data-field="correct" type="number" value="${p.correct}" min="0" max="1000" step="1" required></td><td><input aria-label="${esc(p.label)} yanlış" data-field="wrong" type="number" value="${p.wrong}" min="0" max="1000" step="1" required></td><td class="part-blank">${p.total-p.correct-p.wrong}</td></tr>`).join('')}</tbody></table></div>`;}
function partsFromForm(form){return $$('[data-part]',form).map(tr=>({label:$('.part-label',tr).textContent,total:Number($('[data-field=total]',tr).value),correct:Number($('[data-field=correct]',tr).value),wrong:Number($('[data-field=wrong]',tr).value)}));}
function recalcMock(){const form=$('#exam-form');if(!form)return;try{const parts=partsFromForm(form);$$('[data-part]',form).forEach((tr,i)=>$('.part-blank',tr).textContent=parts[i].total-parts[i].correct-parts[i].wrong);const net=R.calcNet(parts,Number(form.elements.penalty.value));$('#net-preview-number').textContent=format(net.net,2);$('.form-error',form).textContent='';}catch(e){$('#net-preview-number').textContent='—';$('.form-error',form).textContent=e.message;}}
function openExam(existing=null){const type=existing?.type||ui.mockFilter||currentTypes()[0];const selected=currentTypes().includes(type)?type:currentTypes()[0];ui.formContext={kind:'exam',editId:existing?.id||''};const parts=existing?.parts||C.TYPES[selected].parts.map(([label,total])=>({label,total,correct:0,wrong:0}));openModal(existing?'Denemeyi düzenle':'Deneme sonucu ekle',`<form id="exam-form"><div class="form-grid"><label class="field">Deneme türü<select name="type" id="exam-type" ${existing?'disabled':''}>${typeOptions(selected)}</select></label><label class="field">Tarih<input type="date" name="date" value="${existing?.date||today()}" max="${today()}" required></label><label class="field full">Denemenin adı<input name="name" maxlength="120" value="${esc(existing?.name||'')}" placeholder="Yayın adı / deneme numarası" required></label></div><div id="exam-parts" class="mt">${mockRows(parts)}</div><div class="notice mt">Soru sütunu düzenlenebilir bir başlangıç şablonudur. Kullandığın denemenin soru sayılarını kontrol et. Din kültürü muafiyetinde ilgili test toplamını kendi kitapçığına göre gir.</div><div class="form-grid mt"><label class="field">Denemenin yanlış götürme kuralı<select name="penalty"><option value="4" ${!existing||existing.penalty===4?'selected':''}>4 yanlış → 1 doğru</option><option value="3" ${existing?.penalty===3?'selected':''}>3 yanlış → 1 doğru</option><option value="0" ${existing?.penalty===0?'selected':''}>Yanlış götürmez</option></select></label><label class="field">Kısa not (isteğe bağlı)<input name="note" value="${esc(existing?.note||'')}" maxlength="2000" placeholder="Zorlandığım kısım…"></label></div><div class="net-preview"><span class="small">Toplam ham net<br><span class="tiny muted">Resmî puan veya sıralama değildir.</span></span><strong id="net-preview-number">${format(R.calcNet(parts,existing?.penalty??4).net,2)}</strong></div><div class="form-error" role="alert"></div><div class="button-row">${btn('Vazgeç','close-modal','ghost')}<button class="btn primary" type="submit">Denemeyi kaydet ${icon('check')}</button></div></form>`);}
function examDetail(id){const x=w().exams.find(x=>x.id===id);if(!x)return;const n=R.calcNet(x.parts,x.penalty);openModal(x.name,`<p class="muted small mb">${C.TYPES[x.type].label} · ${dateLabel(x.date)} · ${n.total} soru</p><div class="table-wrap"><table><thead><tr><th>TEST</th><th>D</th><th>Y</th><th>BOŞ</th><th>NET</th></tr></thead><tbody>${x.parts.map(p=>{const n=R.calcNet([p],x.penalty);return `<tr><td>${esc(p.label)}</td><td>${p.correct}</td><td>${p.wrong}</td><td>${n.blank}</td><td>${format(n.net,2)}</td></tr>`;}).join('')}</tbody></table></div><div class="net-preview"><span>Toplam ham net</span><strong>${format(n.net,2)}</strong></div>${x.note?`<p class="dialog-desc mt">${esc(x.note)}</p>`:''}<div class="button-row">${btn('Bu denemeyi analiz et '+icon('arrow'),'analyze-exam','primary',`data-id="${x.id}"`)}</div>`);}

 const examId=existing?.examId||anchor?.examId||'',partLabel=existing?.partLabel||anchor?.partLabel||'';

button></div></form>`);

function download(name,contents,type){const blob=new Blob([contents],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);}

function exportCsv(){const cell=v=>'"'+String(v??'').replace(/^[=+@\-]/,"'$&").replace(/"/g,'""')+'"';const rows=[['Sınav','Tarih','Ders','Çalışma','Dakika','Soru','Not'],...w().logs.map(l=>[examLabel(),l.date,subName(l.subjectId,true),l.title,l.minutes,l.questions,l.note])];download(`calisma-rotasi-${state.activeExam}-gunluk-${today()}.csv`,'\ufeff'+rows.map(row=>row.map(cell).join(';')).join('\r\n'),'text/csv;charset=utf-8');}
function resetTimer(t){t.seconds=t.duration*60;t.endAt=0;t.sessionId='';saveTimers();}
function focusSession(id){const p=w().plan.find(x=>x.id===id);if(!p)return;const t=timer();const action=()=>{t.duration=[25,50,90].includes(p.minutes)?p.minutes:25;t.seconds=t.duration*60;t.endAt=0;t.subjectId=p.subjectId;t.sessionId=p.id;saveTimers();navigate('today');$('#timer-subject')?.scrollIntoView({block:'center',behavior:'smooth'});toast('Ders seçildi. Hazır olduğunda sayacı başlat.');};if(t.endAt||remaining(t)<t.duration*60){confirmAction('Odak dersini değiştir?','Mevcut sayaç sıfırlanacak. Henüz kaydetmediğin süre günlüğe eklenmez.',action,'Değiştir');}else action();}
function replaceListRecord(list,record,id){const idx=id?list.findIndex(x=>x.id===id):-1;if(idx>=0)list[idx]=record;else list.push(record);}
function ensureSubject(id){if(!C.subjects.some(s=>s.id===id&&s.exam===state.activeExam))throw Error('Seçili sınava ait bir ders seç.');return id;}
function onSubmit(event){const form=event.target;if(!(form instanceof HTMLFormElement))return;event.preventDefault();try{
 if(teacherSubmit(form))return;if(academySubmit(form))return;if(videoSubmit(form))return;const f=new FormData(form),ctx=ui.formContext;
 if(form.id==='setup-form'){w().settings=readSettings(form);w().profile=readProfile(form);w().configured=true;routeEnsure();w().plan=[];routeRebalance('İlk kişisel rota; ders seviyelerin, hedefin, çalışma günlerin ve kapasiten birlikte kullanılarak oluşturuldu.',true);w().route.lastAutoDate=today();ui.view='today';commit('Kişisel dinamik rotan oluşturuldu.');return;}
 if(form.id==='settings-form'){w().settings=readSettings(form);w().profile=readProfile(form);routeRebalance('Seviye profilin veya hedefin değiştiği için kişisel rota yeniden dengelendi.',true);commit('Ayarların ve seviye profilin kaydedildi; rota yeniden dengelendi.');return;}
 if(form.id==='plan-form'){routeRebalance('Program ekranından rota yeniden dengelendi.',true);commit('Dinamik rota güncellendi.');return;}
 if(form.id==='log-form'){
  const minutes=Number(f.get('minutes')),questions=Number(f.get('questions')),date=String(f.get('date'));
  if(!Number.isInteger(minutes)||minutes<0||minutes>1440||!Number.isInteger(questions)||questions<0||questions>5000||(!minutes&&!questions))throw Error('En az bir dakika çalışma veya bir soru gir. Süre ve soru sayısı negatif ya da kesirli olamaz.');
  if(!R.validDate(date)||date>today())throw Error('Çalışma tarihi bugün veya geçmiş bir gün olmalı.');
  const subjectId=ensureSubject(String(f.get('subjectId'))),title=String(f.get('title')||'').trim().slice(0,180),sessionId=ctx?.sessionId||'';
  if(sessionId&&!ctx.editId&&w().logs.some(l=>l.sessionId===sessionId))throw Error('Bu oturumun çalışma kaydı zaten var. Çalışma günlüğünden düzenleyebilirsin.');
  const record={id:ctx?.editId||R.uid(),date,subjectId,title:title||'Serbest çalışma',minutes,questions,note:String(f.get('note')||'').slice(0,2000),sessionId};
  replaceListRecord(w().logs,record,ctx?.editId);
  if(sessionId){const p=w().plan.find(p=>p.id===sessionId);if(p){p.done=!!f.get('completeSession');if(p.done)routeEvent(p.id,'complete');}}
  if(ctx?.fromTimer)resetTimer(timer());if(sessionId&&f.get('completeSession'))routeRebalance('Tamamlanan görevin ardından kalan rota yeniden dengelendi.',true);closeModal();commit('Çalışman kaydedildi. Bir adım daha.');return;
 }
 if(form.id==='topic-form'){const title=String(f.get('title')||'').trim(),subjectId=ensureSubject(String(f.get('subjectId')));if(!title)throw Error('Konu başlığını yaz.');if(R.allTopics(w(),state.activeExam).some(t=>t.subjectId===subjectId&&t.title.toLocaleLowerCase('tr-TR')===title.toLocaleLowerCase('tr-TR')))throw Error('Bu ders altında aynı konu zaten var.');w().customTopics.push({id:'custom-'+R.uid(),title:title.slice(0,180),subjectId});closeModal();commit('Yeni konu eklendi.');return;}
 if(form.id==='source-form'){const url=String(f.get('url')||'').trim(),position=Number(f.get('position')),status=Number(f.get('status'));if(url&&!R.safeUrl(url))throw Error('Geçerli bir http veya https bağlantısı gir.');if(!Number.isInteger(position)||position<0||position>100000||![0,1,2].includes(status))throw Error('Dakika veya durum bilgisini kontrol et.');w().topicState[ctx.topicId]={status,url:R.safeUrl(url),position,note:String(f.get('note')||'').slice(0,4000),updated:Date.now()};closeModal();commit('Kaynağın ve kaldığın yer kaydedildi.');return;}
 if(form.id==='exam-form'){const type=form.elements.type.value;if(!C.TYPES[type]||C.TYPES[type].exam!==state.activeExam)throw Error('Geçerli bir deneme türü seç.');const name=String(f.get('name')||'').trim(),date=String(f.get('date'));if(!name)throw Error('Denemene bir ad ver.');if(!R.validDate(date)||date>today())throw Error('Deneme tarihi bugün veya geçmiş bir gün olmalı.');const parts=partsFromForm(form),penalty=Number(f.get('penalty'));R.calcNet(parts,penalty);const record={id:ctx?.editId||R.uid(),type,name:name.slice(0,120),date,parts,penalty,note:String(f.get('note')||'').slice(0,2000)};replaceListRecord(w().exams,record,ctx?.editId);ui.mockFilter=type;ui.analysisId=record.id;routeRebalance('Yeni deneme sonucu ders önceliklerini yeniden puanladı.',true);closeModal();commit('Deneme sonucu kaydedildi; rota motoru ders önceliklerini yeniden değerlendirdi.');return;}
  if(form.id==='mistake-form'){
   const title=String(f.get('title')||'').trim(),reviewDate=String(f.get('reviewDate'));if(!title)throw Error('Konu veya soru başlığını yaz.');if(!R.validDate(reviewDate))throw Error('Geçerli bir tekrar tarihi seç.');
   const subjectId=ensureSubject(String(f.get('subjectId'))),examId=String(f.get('examId')||''),partLabel=String(f.get('partLabel')||''),topicId=String(f.get('topicId')||'');
   if(examId){const x=w().exams.find(x=>x.id===examId);if(!x||!x.parts.some(p=>p.label===partLabel))throw Error('Denemenin testini seç.');if(!A.subjectIds(x,partLabel).includes(subjectId))throw Error('Test ile ders eşleşmiyor.');}
   if(topicId&&R.topic(w(),topicId)?.subjectId!==subjectId)throw Error('Konu ile ders eşleşmiyor.');
   const old=w().mistakes.find(m=>m.id===ctx?.editId);
   const record={id:ctx?.editId||R.uid(),subjectId,title:title.slice(0,180),cause:String(f.get('cause')).slice(0,80),note:String(f.get('note')||'').slice(0,4000),reviewDate,resolved:old?.resolved||false,...(examId?{examId,partLabel}:{}),...(topicId?{topicId}:{})};
   replaceListRecord(w().mistakes,record,ctx?.editId);
   // Preserve historical completed sessions. Update only pending sessions when their source note changes.
   for(const p of w().plan.filter(p=>p.sourceMistakeId===record.id)){if(p.done){if(p.subjectId!==record.subjectId)delete p.sourceMistakeId;}else{p.subjectId=record.subjectId;p.topicId=record.topicId||'review-'+record.id;p.title=('Tekrar · '+record.title).slice(0,180);}}
   routeRebalance('Yeni yanlış notu tekrar önceliklerine eklendi.',true);closeModal();commit('Yanlış notun kaydedildi; rota motoru tekrar önceliklerini güncelledi.');return;
  }
  if(form.id==='review-form'){
   const date=String(f.get('date')),minutes=Number(f.get('minutes')),p=A.makeReview(w(),ctx?.mistakeId,date,minutes),load=A.dayLoad(w(),date,minutes);
   if((load.total>load.limit||!load.workingDay)&&!f.get('confirmCapacity'))throw Error('Gün veya süre uyarısını onayla; ya da başka bir tarih seç.');
   w().plan.push(p);w().plan.sort((a,b)=>a.date.localeCompare(b.date));const m=w().mistakes.find(m=>m.id===ctx.mistakeId);m.reviewDate=date;
   closeModal();commit('Tekrarın '+dateLabel(date)+' için programa eklendi.');return;

function showCoverage(){
