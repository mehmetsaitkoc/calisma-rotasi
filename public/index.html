 openModal('Arşivin gerçek durumu',`<p class="dialog-desc mb">“Eşleşen” sütunu, konuya doğrudan bağlanan en az bir video demektir; konunun tamamının işlendiği anlamına gelmez. Kamp sütunu genel / konu oynatma listeleridir; bütün başlıklara dağıtılıp sayılmaz.</p><div class="table-wrap"><table><thead><tr><th>DERS</th><th>BAŞLIK</th><th>EŞLEŞEN</th><th>LİSTE</th></tr></thead><tbody>${rows}</tbody></table></div><p class="notice mt">Başlık ve bağlantı meta verisi incelendi. Gerçek YouTube akışı, videoların tamamı ve yıllık sınav kapsamı bütünüyle doğrulanmadı. Önceki örnek kayıtlarda yeniden kontrol yapılmadığı kaynak notunda belirtilir.</p>`);
}
function openOwnCampaign(sub){
 const s=subject(sub);if(!s||s.exam!==state.activeExam)return;
 const old=w().courseSources?.[sub];ui.formContext={kind:'campaign-source',subjectId:sub};
 openModal('Dersine kendi kampını bağla',`<form id="academy-source-form"><p class="muted small mb">${esc(s.name)} · Bir kez eklediğinde bu dersin kaynak seçeneklerinde kalır.</p><label class="field">YouTube oynatma listesi bağlantısı<input name="url" type="url" maxlength="2000" value="${old?'https://www.youtube.com/playlist?list='+old.playlistId:''}" placeholder="https://www.youtube.com/playlist?list=…" required></label><label class="field mt">Kamp / seri adı<input name="title" value="${esc(old?.title||'')}" maxlength="180" required placeholder="Örneğin: Matematik kampım"></label><label class="field mt">Hoca / kanal<input name="teacher" value="${esc(old?.teacher||'')}" maxlength="100" placeholder="Hocanın veya kanalın adı" required></label><div class="notice mt">Kampın videoları konulara otomatik atanmaz. Konu eşleştirmesini sen onaylarsın. Bu, ödeme veya üyelik işlemi değildir.</div><div class="form-error" role="alert"></div><div class="button-row">${btn('Vazgeç','close-modal','ghost')}<button class="btn primary" type="submit">Kampı kaydet</button></div></form>`);
}
function openCampaign(sub){
 if(subject(sub)?.exam!==state.activeExam)return;
 const cp=courseCampaign(sub);if(!cp)return toast('Önce oynatma listesi olan bir kaynak seç.',true);
 leaveVideo();ui.acSubject=sub;ui.videoTopic='camp-'+sub;ui.view='camp';render();window.scrollTo({top:0,behavior:'instant'});
}
function campaignPage(){
 const sub=turkishSubject(),s=subject(sub),cp=courseCampaign(sub);if(!cp)return turkishPage();
 const prog=w().courseProgress?.[sub]?.[cp.playlistId];
 return `<div class="lesson-breadcrumb">${btn('← Ders rotası','video-ac-open','ghost sm',`data-subject="${sub}"`)}<span>${esc((s.exam==='kpss'?'KPSS':s.stage)+' · '+s.name)}</span><span class="pill plain">Ücretsiz video erişimi</span></div>${head('GENEL KAMP · KONUYA OTOMATİK ATANMAZ',cp.title,'Konunu oynatma listesinden seç. Pomodoro ve kamp notların yanında kalsın.')}
 <div class="lesson-layout"><div class="lesson-main"><section class="lesson-player-card"><header class="lesson-player-top"><span class="youtube-word">${icon('play')} YouTube</span><a class="text-link" href="https://www.youtube.com/playlist?list=${esc(cp.playlistId)}" target="_blank" rel="noopener noreferrer">Listeyi YouTube’da aç ↗</a></header><div id="lesson-player-zone" class="lesson-player-zone"><div class="video-consent"><span class="video-kicker">GENEL DERS LİSTESİ</span><span class="video-consent-icon">${icon('play')}</span><h2>${esc(s.name)}</h2><p>${esc(cp.teacher)}</p>${btn('Kamp oynatıcısını aç '+icon('right'),'video-load','video-load')}<small>YouTube’a bağlantı kurulur. Otomatik oynatma kapalıdır.</small></div></div><div id="video-status" class="video-status" role="status" aria-live="polite">${prog?'Önceki liste sırası ve kayıtlı konumla açılacak.':'Videoyu YouTube oynatıcısının listesinden kendin seç.'}</div><div id="video-error" class="video-error" role="alert" hidden></div>${location.protocol==='file:'?`<div class="video-local-warning">Dosya önizlemesinde YouTube engellenebilir. ${btn('Açılış yardımı','video-help','ghost sm')}</div>`:''}<div class="campaign-notice"><strong>Bu oynatma listesi, tek bir konuya eşlenmiş video değildir.</strong><p>${esc(cp.limitation||'Kaynağın kapsamını kontrol et.')}</p></div><div class="campaign-bind">${btn(icon('link')+' Oynayan videoyu konuya bağla','video-ac-bind','primary')}<p>Konu ve başlığı sen seçersin. Uygulama içerikten otomatik konu tahmin etmez.</p></div></section><section class="card lesson-notes-card"><div class="card-head"><div><div class="eyebrow">DERSE ÖZEL</div><h3>Kamp notların</h3></div><span class="tiny muted" id="lesson-note-state">Konu notlarından ayrı</span></div><label class="sr-only" for="lesson-notes">Kamp notların</label><textarea id="lesson-notes" maxlength="4000" placeholder="Kampı izlerken aldığın notlar…">${esc(w().courseNotes?.[sub]||'')}</textarea><div class="lesson-note-bottom"><span class="tiny muted">Bu notlar yedeğine dahil edilir.</span>${btn('Notu kaydet','video-note-save','sm ghost')}</div></section></div><aside class="lesson-side">${lessonTimerCard()}<section class="card"><h3>Konuyu sen belirlersin.</h3><p class="muted small mt">Kampı izlemek bir konuyu otomatik tamamlamaz. İzlediğin bölümü uygun konuya bağladıktan sonra, konu çalışma alanından devam edebilirsin.</p>${btn('Dersin tüm konuları','video-ac-open','ghost sm mt',`data-subject="${sub}"`)}</section></aside></div>`;
}
function mountCampaignPage(){
 if(ui.view!=='camp'||!$('#lesson-player-zone'))return;const sub=turkishSubject(),cp=courseCampaign(sub);if(!cp)return;
 activeLecture={exam:state.activeExam,topicId:'camp-'+sub,subjectId:sub,camp:cp,space:w(),video:null,player:null,ready:false,timeout:null};updateStudyUI();
}
async function loadCampaignVideo(){
 const a=activeLecture;if(!a?.camp)return;if(a.player)return;
 setVideoStatus('YouTube kamp listesi yükleniyor…');$('#video-error').hidden=true;
 $('#lesson-player-zone').innerHTML='<div class="video-loading"><p>Kamp oynatıcısı yükleniyor…</p><small>İnternet bağlantısı gerektirir.</small></div>';
 clearTimeout(a.timeout);a.timeout=setTimeout(()=>{if(activeLecture===a&&!a.ready){setVideoStatus('YouTube yanıt vermedi. Listeyi YouTube’da açabilir veya yeniden deneyebilirsin.',true);addRetryButton();}},12000);
 try{const YT=await loadYouTubeAPI();if(activeLecture!==a)return;$('#lesson-player-zone').innerHTML='<div id="rota-yt-player"></div>';
 const prog=a.space.courseProgress?.[a.subjectId]?.[a.camp.playlistId];
 const vars={listType:'playlist',list:a.camp.playlistId,playsinline:1,controls:1,rel:0,autoplay:0};if(['https:','http:'].includes(location.protocol))vars.origin=location.origin;
 a.player=new YT.Player('rota-yt-player',{width:'100%',height:'100%',host:'https://www.youtube-nocookie.com',playerVars:vars,events:{
 onReady:()=>{if(activeLecture!==a)return;a.ready=true;clearTimeout(a.timeout);a.player.getIframe().title=a.camp.title+' · YouTube kamp listesi';a.player.getIframe().setAttribute('referrerpolicy','strict-origin-when-cross-origin');setVideoStatus('Kamp listesi yüklendi. Oynatıcıdan bölümünü seç; Pomodoro’yu kendin başlat.');if(prog&&typeof a.player.cuePlaylist==='function'){a.resumeExpected=prog;a.player.cuePlaylist({listType:'playlist',list:a.camp.playlistId,index:prog.index,startSeconds:0});}},
 onStateChange:e=>{if(activeLecture!==a)return;if(e.data===5&&a.resumeExpected){const expected=a.resumeExpected;a.resumeExpected=null;let v;try{v=V.parseYouTube(a.player.getVideoUrl());}catch{}if(v?.id===expected.videoId){a.player.seekTo(expected.second,true);setVideoStatus('Kayıtlı bölüm ve saniye bulundu. Oynatmayı kendin başlat.');}else setVideoStatus('Liste sırası değişmiş olabilir. Yanlış videoya eski saniye uygulanmadı. Bölümünü kendin seç.');}if([0,2].includes(e.data))persistLecture();},
 onError:e=>{if(activeLecture!==a)return;clearTimeout(a.timeout);const msg=e.data===153?'YouTube kaynak adresini doğrulayamadı. Dosya yerine web/yerel sunucu sürümü gerekebilir.':[100,101,150].includes(e.data)?'Kaynak veya bazı bölümler gömülü oynatmaya kapalı olabilir.':'Kamp oynatıcısı başlatılamadı.';setVideoStatus(msg+' YouTube bağlantısını kullanabilirsin. (Kod '+e.data+')',true);addRetryButton();}
 }});
 }catch(e){if(activeLecture===a){clearTimeout(a.timeout);setVideoStatus(e.message,true);addRetryButton();}}
}
function persistCampaign(a){
 try{if(!a.ready)return;const parsed=V.parseYouTube(a.player.getVideoUrl()),index=a.player.getPlaylistIndex(),second=Math.floor(a.player.getCurrentTime());
 if(!parsed||!Number.isInteger(index)||index<0||index>10000||!Number.isFinite(second)||second<0||second>604800)return;
 a.space.courseProgress=a.space.courseProgress||{};const by=a.space.courseProgress[a.subjectId]||(a.space.courseProgress[a.subjectId]={}),r={videoId:parsed.id,index,second};
 if(JSON.stringify(by[a.camp.playlistId])!==JSON.stringify(r)){by[a.camp.playlistId]=r;if(state.workspaces[a.exam]===a.space)save();}
 }catch{}
}
function bindCurrentVideo(){
 const a=activeLecture;if(!a?.camp||!a.ready)return toast('Önce kamp oynatıcısını aç ve bir videoyu başlat.',true);
 let parsed;try{parsed=V.parseYouTube(a.player.getVideoUrl());}catch{}if(!parsed)return toast('Oynayan video bağlantısı alınamadı. Tek videonun bağlantısını konu ekranından ekleyebilirsin.',true);
 const sub=a.subjectId,ts=courseStats(subject(sub)).topics;pauseLessonPlayer();ui.formContext={kind:'campaign-bind',subjectId:sub,videoId:parsed.id,teacher:a.camp.teacher};
 openModal('Bu videoyu hangi konuya bağlayalım?',`<form id="academy-bind-form"><div class="notice mb">Videonun hangi konuya ait olduğunu sen doğrula. Bu işlem yalnızca kişisel video bağlantını ekler; konuyu tamamlamaz.</div><label class="field">Konu<select name="topicId">${ts.map(t=>`<option value="${t.id}">${esc(t.title)}</option>`).join('')}</select></label><label class="field mt">Videonun bölüm başlığı<input name="title" required maxlength="180" placeholder="Videonun başlığını / bölümünü yaz"></label><p class="muted tiny mt">${esc(a.camp.teacher)} · ${esc(parsed.url)}</p><div class="form-error" role="alert"></div><div class="button-row">${btn('Vazgeç','close-modal','ghost')}<button class="btn primary" type="submit">Bu konuya bağla</button></div></form>`);
}
function openCampaignLog(){
 const a=activeLecture;if(!a?.camp)return;const t=studyClock();handleClockEvent(V.pause(t));pauseLessonPlayer();saveStudyClocks();updateStudyUI();
 ui.formContext={kind:'campaign-log',subjectId:a.subjectId,clockId:t.id,playlistId:a.camp.playlistId};
 openModal('Kamp çalışmanı kaydet',`<form id="academy-log-form"><div class="review-summary"><h3>${esc(subject(a.subjectId).name)}</h3><p>Genel kamp çalışması · ${videoTime(Math.floor(t.bankMs/1000))} odak, mola hariç.</p></div><div class="form-grid"><label class="field">Çalışma süresi (dakika)<input type="number" name="minutes" min="0" max="1440" step="1" value="${Math.floor(t.bankMs/60000)}" required></label><label class="field">Çözülen soru<input type="number" name="questions" min="0" max="5000" step="1" value="0" required></label><label class="field full">Tarih<input type="date" name="date" value="${today()}" max="${today()}" required></label><label class="field full">Çalışma notu<input name="note" maxlength="1500" placeholder="Neler çalıştın?"></label></div><p class="muted tiny mt">Bir konuya otomatik atama veya konu tamamlama yapılmaz. Süreyi sen onaylarsın.</p><div class="form-error" role="alert"></div><div class="button-row">${btn('Vazgeç','close-modal','ghost')}<button class="btn primary" type="submit">Günlüğe kaydet</button></div></form>`);
}
function academySubmit(form){
 if(!['academy-source-form','academy-bind-form','academy-log-form'].includes(form.id))return false;
 const f=new FormData(form),ctx=ui.formContext;if(!ctx||subject(ctx.subjectId)?.exam!==state.activeExam)throw Error('Seçili ders değişti; formu yeniden aç.');
 if(form.id==='academy-source-form'){
  const p=V.TC.parsePlaylist(String(f.get('url')||'')),title=String(f.get('title')||'').trim(),teacher=String(f.get('teacher')||'').trim();if(!p)throw Error('Geçerli bir YouTube oynatma listesi bağlantısı gir. Tek video değil, list= içeren bağlantı gerekir.');if(!title||!teacher)throw Error('Kampın ve hocanın adını yaz.');
  leaveVideo();w().courseSources=w().courseSources||{};w().courseSources[ctx.subjectId]={playlistId:p.id,title:title.slice(0,180),teacher:teacher.slice(0,100)};w().turkishPrefs={...(w().turkishPrefs||{}),[ctx.subjectId]:'custom'};ui.acSubject=ctx.subjectId;ui.view='turkish';closeModal();commit('Kendi kampın bu derse eklendi.');return true;
 }
 if(form.id==='academy-bind-form'){
  const tid=String(f.get('topicId')),title=String(f.get('title')||'').trim();if(R.topic(w(),tid)?.subjectId!==ctx.subjectId)throw Error('Bu dersten bir konu seç.');if(!title)throw Error('Bölüm başlığını yaz.');const l=lessonData(tid);if(V.allResources(w(),tid).some(v=>v.id===ctx.videoId))throw Error('Bu video konuya zaten bağlı.');if(l.customVideos.length>=25)throw Error('Bir konuya en fazla 25 kişisel video eklenir.');
  l.customVideos.push({id:ctx.videoId,title:title.slice(0,180),teacher:ctx.teacher.slice(0,100),start:0});l.activeId=ctx.videoId;l.updated=Date.now();const ok=save();closeModal();toast(ok?'Video seçtiğin konuya eklendi. Konu durumu değiştirilmedi.':'Bu oturumda eklendi; kalıcı kayıt için yedek al.',!ok);return true;
 }
 const t=studyClock();if(ctx.clockId!==t.id)throw Error('Sayaç değişti; formu yeniden aç.');const min=Number(f.get('minutes')),q=Number(f.get('questions')),date=String(f.get('date'));
 if(!Number.isInteger(min)||min<0||min>1440||!Number.isInteger(q)||q<0||q>5000||(!min&&!q))throw Error('En az 1 dakika veya 1 soru gir.');if(!R.validDate(date)||date>today())throw Error('Tarihi kontrol et.');const id='camp-'+t.id;if(w().logs.some(l=>l.id===id))throw Error('Bu oturum zaten kaydedildi.');
 w().logs.push({id,date,subjectId:ctx.subjectId,title:('Kamp çalışması · '+subject(ctx.subjectId).name).slice(0,180),minutes:min,questions:q,note:(String(f.get('note')||'').trim()+'\nKamp: https://www.youtube.com/playlist?list='+ctx.playlistId).slice(0,2000),sessionId:''});
 const oldPause=t.pauseVideo;studyClocks[state.activeExam][ui.videoTopic]=V.newClock(t.duration);studyClocks[state.activeExam][ui.videoTopic].pauseVideo=oldPause;saveStudyClocks();closeModal();commit('Kamp çalışman günlüğe eklendi. Konu durumları değişmedi.');return true;
}
function academyAction(b){
 switch(b.dataset.action){
 case 'video-ac-open':openCourse(b.dataset.subject);break;
 case 'video-ac-filter':ui.acScope=b.dataset.scope;render();break;
 case 'video-ac-coverage':showCoverage();break;
 case 'video-ac-add':openOwnCampaign(b.dataset.subject);break;
 case 'video-ac-camp':openCampaign(b.dataset.subject);break;
 case 'video-ac-bind':bindCurrentVideo();break;
 }
}
document.addEventListener('change',e=>{if(e.target.id==='academy-course-select')openCourse(e.target.value);});
document.addEventListener('input',e=>{if(e.target.id==='academy-search'){const pos=e.target.selectionStart;ui.acQuery=e.target.value;render();const n=$('#academy-search');n.focus();n.setSelectionRange(pos,pos);}});

document.addEventListener('click',onAction);
document.addEventListener('submit',onSubmit);
document.addEventListener('change',event=>{const el=event.target;if(el.id==='mock-filter'){ui.mockFilter=el.value;ui.analysisId='';render();}if(el.id==='analysis-exam'){ui.analysisId=el.value;render();}if(el.closest('#mistake-form')){const fields={examId:'exam',partLabel:'part',subjectId:'subject',topicId:'topic'};if(fields[el.name])refreshMistakeFields(fields[el.name]);}if(el.closest('#review-form')&&['date','minutes'].includes(el.name))updateReviewCapacity();if(el.id==='report-month'&&/^\d{4}-\d{2}$/.test(el.value)){ui.month=el.value;render();}if(el.id==='timer-subject'){timer().subjectId=el.value;timer().sessionId='';saveTimers();}if(el.id==='exam-type'){const def=C.TYPES[el.value];if(def){$('#exam-parts').innerHTML=mockRows(def.parts.map(([label,total])=>({label,total,correct:0,wrong:0})));recalcMock();}}if(el.closest('#exam-form'))recalcMock();});
document.addEventListener('input',event=>{const el=event.target;if(el.id==='topic-search'){const pos=el.selectionStart;ui.query=el.value;render();const input=$('#topic-search');input.focus();input.setSelectionRange(pos,pos);}if(el.closest('#exam-form'))recalcMock();});
$('#backup-file').addEventListener('change',async event=>{const file=event.target.files[0];if(!file)return;try{if(file.size>2*1024*1024)throw Error('Yedek dosyası en fazla 2 MB olabilir.');const parsed=R.validateBackup(JSON.parse(await file.text()));confirmAction('İki sınavın yedeğini yükle?','Bu işlem KPSS ve YKS alanlarının tüm mevcut kayıtlarını yedekle değiştirir. İşleme devam etmeden önce mevcut kayıtlarını dışa aktar.',()=>{leaveVideo();studyClocks={kpss:{},yks:{}};saveStudyClocks();state=parsed;storageBlocked=false;storageProblem='';$('#storage-warning').hidden=true;timers={};saveTimers();ui.view=state.activeExam&&w().configured?'today':'select';ui.mockFilter='';ui.stage='all';ui.query='';commit('Yedek yüklendi. Kayıtların hazır.');},'Yedeği yükle');}catch(e){toast('Yedek yüklenmedi: '+e.message,true);}});
$('#modal').addEventListener('cancel',()=>{ui.confirmFn=null;ui.formContext=null;});
setInterval(()=>{for(const e of ['kpss','yks']){const t=timers[e];if(t?.endAt&&remaining(t)===0){t.seconds=0;t.endAt=0;saveTimers();toast(`${e.toLocaleUpperCase('tr-TR')} odak oturumun bitti. Kaydını eklemeyi unutma.`);if(state.activeExam===e&&ui.view==='today')render();}}if(state.activeExam&&ui.view==='today'){const t=timer(),clock=$('#clock');if(clock)clock.textContent=clockText(remaining(t));}},250);
// İki sekmenin sessizce birbirinin kayıtlarını ezmesini önle.
window.addEventListener('storage',e=>{if(e.key===KEY){storageBlocked=true;storageProblem='Başka bir sekmede kayıt değişti. Üzerine yazmamak için bu sekmede kalıcı kayıt durduruldu. Açık formunu korumak için yedek al veya sayfayı yenile.';showStorageWarning();}});
render();
})();
