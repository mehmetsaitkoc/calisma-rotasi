<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Hesabım · Çalışma Rotası</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 10%,#e7f0ff 0,transparent 34%),radial-gradient(circle at 90% 0,#efe8ff 0,transparent 28%),#f5f7fb}
    button,input{font:inherit}.shell{min-height:100vh;display:grid;place-items:center;padding:28px}.card{width:min(100%,460px);background:#fff;border:1px solid #e6eaf1;border-radius:26px;box-shadow:0 24px 70px rgba(31,41,55,.11);padding:28px}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}.mark{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,#5b6cff,#7f55ff);color:#fff;font-weight:900;font-size:22px}.brand strong{display:block;font-size:19px}.brand small{color:#79839a}
    h1{font-size:28px;line-height:1.08;margin:0 0 8px}p{color:#697386;line-height:1.55;margin:0 0 22px}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#f1f4f9;padding:4px;border-radius:14px;margin-bottom:20px}.tab{border:0;background:transparent;border-radius:11px;padding:11px;font-weight:800;color:#657086;cursor:pointer}.tab.active{background:#fff;color:#27324b;box-shadow:0 3px 12px rgba(38,45,64,.08)}
    form{display:grid;gap:14px}.field{display:grid;gap:7px}.field span{font-size:13px;font-weight:800;color:#475169}.field input{width:100%;border:1px solid #dce2ec;border-radius:13px;padding:13px 14px;outline:none;background:#fff}.field input:focus{border-color:#6979ff;box-shadow:0 0 0 4px rgba(105,121,255,.12)}
    .primary,.secondary,.danger{border:0;border-radius:14px;padding:13px 16px;font-weight:900;cursor:pointer}.primary{color:#fff;background:linear-gradient(135deg,#5869ff,#7f55ff)}.secondary{color:#34405a;background:#eef1f7}.danger{color:#9b2c2c;background:#fff0f0}.primary:disabled{opacity:.6;cursor:wait}
    .status{display:none;margin-top:16px;padding:12px 14px;border-radius:12px;background:#eef4ff;color:#314977;font-size:14px;line-height:1.45}.status.show{display:block}.status.error{background:#fff0f0;color:#8d2f2f}.account{display:none}.account.show{display:block}.account-box{background:#f6f8fc;border:1px solid #e7ebf2;border-radius:16px;padding:16px;margin:18px 0}.account-box b{display:block}.account-box span{font-size:13px;color:#6f788a}.actions{display:grid;gap:10px}.back{display:inline-flex;margin-top:18px;color:#64708a;text-decoration:none;font-weight:700;font-size:13px}.admin{display:none}.admin.show{display:block}
  </style>
</head>
<body>
  <main class="shell">
    <section class="card">
      <div class="brand"><div class="mark">R</div><div><strong>Çalışma Rotası</strong><small>Hesabın ve rotan birlikte</small></div></div>

      <div id="authView">
        <h1>Rotanı hesabına bağla.</h1>
        <p>Çalışmaların, testlerin, yanlışların ve rota kararların hesabında güvenle senkronlansın.</p>
        <div class="tabs">
          <button class="tab active" id="loginTab" type="button">Giriş Yap</button>
          <button class="tab" id="signupTab" type="button">Kayıt Ol</button>
        </div>

        <form id="loginForm">
          <label class="field"><span>E-posta</span><input id="loginEmail" type="email" autocomplete="email" required></label>
          <label class="field"><span>Şifre</span><input id="loginPassword" type="password" autocomplete="current-password" minlength="8" required></label>
          <button class="primary" id="loginButton" type="submit">Giriş Yap</button>
        </form>

        <form id="signupForm" hidden>
          <label class="field"><span>Ad soyad</span><input id="signupName" autocomplete="name" maxlength="120" required></label>
          <label class="field"><span>E-posta</span><input id="signupEmail" type="email" autocomplete="email" required></label>
          <label class="field"><span>Şifre</span><input id="signupPassword" type="password" autocomplete="new-password" minlength="8" required></label>
          <button class="primary" id="signupButton" type="submit">Hesap Oluştur</button>
        </form>
      </div>

      <div class="account" id="accountView">
        <h1>Hesabın bağlı.</h1>
        <p>Bu cihazdaki çalışma alanın hesabınla senkronlanır.</p>
        <div class="account-box"><b id="accountName">Öğrenci</b><span id="accountEmail"></span></div>
        <div class="actions">
          <button class="primary" id="continueButton" type="button">Çalışma Rotası'na dön</button>
          <button class="secondary admin" id="adminButton" type="button">Yönetici Paneli</button>
          <button class="secondary" id="syncButton" type="button">Şimdi senkronla</button>
          <button class="danger" id="logoutButton" type="button">Çıkış Yap</button>
        </div>
      </div>

      <div class="status" id="status"></div>
      <a class="back" href="/">← Ana sayfaya dön</a>
    </section>
  </main>

  <script src="/cloud-auth.js?v=1"></script>
  <script>
    (() => {
      const $=(id)=>document.getElementById(id);
      const status=$('status');
      const authView=$('authView');
      const accountView=$('accountView');
      const loginForm=$('loginForm');
      const signupForm=$('signupForm');
      const returnTo=(()=>{
        const value=new URLSearchParams(location.search).get('return')||'/';
        return value.startsWith('/')&&!value.startsWith('//')?value:'/';
      })();

      function message(text,error=false){
        status.textContent=text||'';
        status.className='status'+(text?' show':'')+(error?' error':'');
      }
      function mode(name){
        const login=name==='login';
        $('loginTab').classList.toggle('active',login);
        $('signupTab').classList.toggle('active',!login);
        loginForm.hidden=!login;
        signupForm.hidden=login;
        message('');
      }
      $('loginTab').onclick=()=>mode('login');
      $('signupTab').onclick=()=>mode('signup');

      async function refresh(){
        try{
          const user=await window.RotaCloud.currentUser();
          authView.style.display=user?'none':'block';
          accountView.classList.toggle('show',!!user);
          if(!user)return;
          $('accountName').textContent=user.user_metadata?.full_name||'Öğrenci';
          $('accountEmail').textContent=user.email||'';
          $('adminButton').classList.toggle('show',user.app_metadata?.role==='admin');
        }catch(error){message(error.message||'Hesap bilgisi alınamadı.',true);}
      }

      loginForm.addEventListener('submit',async(event)=>{
        event.preventDefault();message('');
        const button=$('loginButton');button.disabled=true;
        try{
          const {data,error}=await window.RotaCloud.signIn({email:$('loginEmail').value,password:$('loginPassword').value});
          if(error)throw error;
          if(!data?.session)throw new Error('Oturum açılamadı.');
          location.href=returnTo;
        }catch(error){message(error.message||'Giriş yapılamadı.',true);}
        finally{button.disabled=false;}
      });

      signupForm.addEventListener('submit',async(event)=>{
        event.preventDefault();message('');
        const button=$('signupButton');button.disabled=true;
        try{
          const {data,error}=await window.RotaCloud.signUp({email:$('signupEmail').value,password:$('signupPassword').value,fullName:$('signupName').value});
          if(error)throw error;
          if(data?.session){location.href=returnTo;return;}
          message('Hesabın oluşturuldu. E-posta doğrulaması açıksa gelen bağlantıyla hesabını doğrula, sonra giriş yap.');
          mode('login');
        }catch(error){message(error.message||'Hesap oluşturulamadı.',true);}
        finally{button.disabled=false;}
      });

      $('continueButton').onclick=()=>{location.href=returnTo==='/'?'/':returnTo;};
      $('adminButton').onclick=()=>{location.href='/admin.html';};
      $('syncButton').onclick=async()=>{
        message('Senkronlanıyor…');
        try{
          const result=await window.RotaCloud.syncNow({reload:false});
          message('Senkron tamamlandı: '+(result?.status||'tamamlandı')+'.');
        }catch(error){message(error.message||'Senkron başarısız.',true);}
      };
      $('logoutButton').onclick=async()=>{
        message('Çıkış yapılıyor…');
        try{await window.RotaCloud.signOut();location.href='/';}
        catch(error){message(error.message||'Çıkış yapılamadı.',true);}
      };

      refresh();
    })();
  </script>
</body>
</html>
