services:
  - type: web
    name: calisma-rotasi-beta
    runtime: static
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run web:static
    staticPublishPath: ./dist-web-beta
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /runtime/kpss-bundle/*
        name: Cache-Control
        value: public, max-age=300, stale-while-revalidate=86400
