services:
  - type: web
    name: calisma-rotasi
    runtime: node
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: ROTA_ACCOUNTS_MODE
        value: local-only
      - key: HOST
        value: 0.0.0.0
