services:
  - type: web
    name: calisma-rotasi
    runtime: node
    plan: free
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: ROTA_ACCOUNTS_MODE
        value: local-only
      - key: OPENAI_API_KEY
        sync: false
      - key: ROTA_AI_PROFILE
        value: best
      - key: HOST
        value: 0.0.0.0
